name: urovault
description: UroVault - Your Urology Practice, Organised.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  photo_view: ^0.15.0
  open_filex: ^4.4.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  share_plus: ^9.0.0
  archive: ^3.6.1
  csv: ^6.0.0
  pdf: ^3.11.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/logo_mark.svg
    - assets/brand/logo_mark_light.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F2942"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
