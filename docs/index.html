<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/Inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/Inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/Inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/Inter-700.woff2) format("woff2")}
:root{
  --navy:#0F2942;--navy2:#0B4A55;--teal:#0D9488;--btn:#0B8378;--link:#0F766E;--lt:#E6F7F5;
  --bg:#F8FAFC;--t2:#64748B;--red:#EF4444;--redd:#B91C1C;--green:#10B981;--greend:#047857;--amber:#F59E0B;--amberd:#B45309;
  --bd:#E2E8F0;--redt:#FEE2E2;--greent:#D1FAE5;--ambert:#FEF3C7;--grey:#F1F5F9;
  --r:16px;--sh:0 3px 12px rgba(15,41,66,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--navy)}
.ic{display:inline-block;vertical-align:middle;flex:none}
#app{min-height:100vh;min-height:100dvh}
.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:var(--sat)}
.hdr .in{max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px}
.hdr h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px}
.hdr .ib:active{background:rgba(255,255,255,.14)}
.hdr .sp{width:44px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.page{padding-top:14px;padding-bottom:calc(96px + var(--sab))}
.page.nobar{padding-bottom:calc(28px + var(--sab))}
.dhead{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 28px 28px;padding-top:var(--sat)}
.dhead .in{max-width:640px;margin:0 auto;padding:6px 16px 22px}
.dhead .top{display:flex;align-items:center;gap:8px;height:48px}
.dhead .brand{font-size:18px;font-weight:700;flex:1}
.dhead .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative}
.dhead .ib:active{background:rgba(255,255,255,.14)}
.dot{position:absolute;top:9px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.greet{font-size:26px;font-weight:700;line-height:1.2;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;color:var(--navy);border-radius:16px;padding:14px 6px 12px;text-align:center;border:0;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .l{font-size:12px;color:var(--t2);font-weight:500}
.stat .ic{color:var(--teal)}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:10px}
.card.tap{cursor:pointer}.card.tap:active{background:#F1F5F9}
.card.sel{background:var(--lt);border-color:var(--teal)}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px}
.tile .grow{flex:1;min-width:0}
.t-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub b{color:var(--navy);font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lt);color:var(--link);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.lg{width:54px;height:54px;font-size:18px}
.iconbox{width:42px;height:42px;border-radius:12px;background:var(--lt);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.sec{display:flex;align-items:center;margin:22px 0 10px}
.sec h2{flex:1;margin:0;font-size:15px;font-weight:700}
.sec a,.sec button{background:none;border:0;color:var(--link);font-weight:600;font-size:13px;padding:6px 0}
.small{font-size:12.5px;color:var(--t2)}
.muted{color:var(--t2)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--t2);text-transform:uppercase;margin:16px 0 6px}
.lbl i{color:var(--red);font-style:normal}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--lt);color:var(--link);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.red{background:var(--redt);color:var(--redd)}.pill.green{background:var(--greent);color:var(--greend)}.pill.amber{background:var(--ambert);color:var(--amberd)}.pill.grey{background:var(--grey);color:var(--navy)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1.5px solid var(--bd);background:#fff;color:var(--navy);padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip .c{opacity:.75;margin-left:6px;font-weight:600}
.chip.sm{padding:6px 11px;font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-size:16px;font-weight:600}
.btn:active{filter:brightness(.92)}.btn[disabled]{opacity:.55}
.btn.o{background:#fff;color:var(--link);border:1.5px solid var(--btn);height:46px;font-size:14px}
.btn.red{background:var(--red)}
.btn.sm{height:40px;font-size:13.5px;border-radius:12px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--bd);padding:10px 16px calc(10px + var(--sab))}
.bar .in{max-width:608px;margin:0 auto}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;font-size:13px;padding:4px 0}
.inp,.ta,.sel{width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.ta{min-height:104px;resize:vertical;line-height:1.45}
.inp.err,.ta.err{border-color:var(--red)}
.inp.uhid{font-size:22px;font-weight:700;letter-spacing:.8px;background:var(--lt);border:2px solid var(--teal);padding:16px;border-radius:14px;text-transform:uppercase}
.inp.uhid.err{border-color:var(--red);background:var(--redt)}
.ferr{color:var(--redd);font-size:12.5px;margin-top:5px;font-weight:500}
.dup{margin-top:8px;padding:11px 12px;background:var(--redt);color:var(--redd);border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.dup button{margin-left:auto;background:none;border:0;color:var(--redd);font-weight:700}
.seg{display:flex;gap:6px}.seg button{flex:1;height:50px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;font-size:14px;font-weight:600;color:var(--navy)}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.seg.err button{border-color:var(--red)}
.two{display:grid;grid-template-columns:2fr 5fr;gap:14px}
.banner{display:flex;align-items:center;gap:8px;background:var(--lt);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:6px}
.banner button{margin-left:auto;background:none;border:0;color:var(--link);font-weight:600}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.chk.r{border-radius:50%}.chk.on{background:var(--btn);border-color:var(--btn)}
.irow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}
.irow:last-child{border-bottom:0}
.irow .ic{color:var(--teal);margin-top:2px}
.irow .k{font-size:12px;color:var(--t2)}.irow .v{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);scrollbar-width:none;position:sticky;top:calc(52px + var(--sat));z-index:12}
.tabs::-webkit-scrollbar{display:none}
.tabs .in{display:flex;max-width:640px;margin:0 auto;width:100%;padding:0 6px}
.tab{flex:1;flex-shrink:0;border:0;background:none;padding:13px 8px;font-size:13.5px;font-weight:500;color:var(--t2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--link);font-weight:700;border-color:var(--teal)}
.phead{display:flex;gap:12px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mi{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--grey);border:0;padding:0}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:10.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.file{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lt);color:var(--teal);gap:4px;font-size:11px;padding:6px;text-align:center}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--grey);border:0;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.file{display:flex;align-items:center;justify-content:center;background:var(--lt);color:var(--teal)}
.th .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.th .x.red{background:var(--red)}
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.viewer .vt{display:flex;align-items:center;padding:calc(6px + var(--sat)) 8px 6px;color:#fff;background:#000}
.viewer .vt .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.viewer .vt .cnt{flex:1;text-align:center;font-size:14px;font-weight:600}
.viewer .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.viewer .stage img{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.viewer .vb{padding:12px 18px calc(12px + var(--sab));background:#0B1B2D;color:#fff;font-size:14px}
.viewer .nav{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;border:0;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center}
.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--bd)}
.tl .ev{position:relative;margin-bottom:10px}
.tl .ev:before{content:"";position:absolute;left:-25px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid var(--teal)}
.tl .ev.hollow:before{background:#fff}
.tl .ev.red:before{background:var(--red);border-color:var(--red)}.tl .ev.green:before{background:var(--green);border-color:var(--green)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);padding-bottom:var(--sab)}
.nav .in{max-width:640px;margin:0 auto;height:62px;display:flex;align-items:center}
.nav button{flex:1;height:62px;border:0;background:none;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500}
.nav button.on{color:var(--link);font-weight:700}
.nav .plus{flex:1;display:flex;justify-content:center}
.nav .plus button{flex:none;width:52px;height:52px;border-radius:50%;background:var(--btn);color:#fff;box-shadow:0 5px 14px rgba(13,148,136,.4);margin-top:-6px}
.empty{text-align:center;padding:40px 24px}
.empty .ring{width:76px;height:76px;border-radius:50%;background:var(--lt);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty h3{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--t2);font-size:13.5px}
.empty .btn{width:auto;display:inline-flex;padding:0 26px}
.mrow{display:flex;align-items:center;gap:14px;cursor:pointer}
.mrow .grow{flex:1}
.mrow .t{font-weight:600}.mrow .s{font-size:12.5px;color:var(--t2)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--navy)}
.qa button:active{background:#F1F5F9}
.qa .iconbox{width:46px;height:46px;border-radius:14px}
.dxcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.dxcard .nm{flex:1;font-weight:600;font-size:15px}
.dxcard .iconbox{background:#fff;border:1px solid var(--bd)}
.card.sel .iconbox{border-color:var(--teal)}
.sub{margin-top:12px;padding-top:12px;border-top:1px dashed #99D5CF}
.bars .br{display:flex;align-items:center;gap:10px;padding:6px 0}
.bars .nm{width:112px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .tr{flex:1;height:10px;border-radius:6px;background:var(--lt);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bars b{width:28px;text-align:right}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,41,66,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 20px calc(18px + var(--sab));max-height:88vh;overflow:auto;animation:up .2s}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#CBD5E1;margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px}
.modal{background:#fff;border-radius:18px;max-width:340px;width:calc(100% - 40px);padding:20px;align-self:center;animation:pop .15s}
.modal h3{margin:0 0 8px;font-size:17px}.modal p{margin:0 0 18px;color:#334155;font-size:14.5px}
.modal .row .btn{height:44px;font-size:15px}
.scrim.mid{align-items:center}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}
.busy{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600}
.spin{width:34px;height:34px;border:4px solid var(--lt);border-top-color:var(--teal);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.splash{position:fixed;inset:0;background:linear-gradient(180deg,var(--navy),#0B3B4F);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;overflow:hidden}
.splash .lg{animation:pop .9s cubic-bezier(.2,.9,.3,1.2)}
.splash h1{font-size:38px;margin:16px 0 6px;font-weight:700;animation:fade 1.2s}
.splash p{margin:0;opacity:.8;font-size:14px;animation:fade 1.6s}
.splash svg.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
.auth{min-height:100vh;min-height:100dvh;background:#fff;padding:calc(30px + var(--sat)) 24px calc(30px + var(--sab))}
.auth .in{max-width:420px;margin:0 auto}
.auth .logo{text-align:center}
.auth h1{text-align:center;margin:0;font-size:28px}
.auth .sub2{text-align:center;color:var(--t2);margin:6px 0 26px}
.pwrap{position:relative}.pwrap button{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:none;color:var(--t2)}
.feat{display:flex;gap:14px;align-items:center;padding:12px 14px}
.feat .t{font-weight:600}.feat .s{font-size:12.5px;color:var(--t2)}
.ios{margin-top:22px;padding:12px;background:var(--lt);border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
@media print{
  .hdr,.bar,.nav,.toast,.noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}.page{padding:0}
}
input[type=date].inp{min-height:50px;display:block;text-align:left;-webkit-min-logical-width:calc(100% - 2px)}
.fab-row{display:flex;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--t2)}.kv span:last-child{font-weight:600;text-align:right}
.sw{width:50px;height:30px;border-radius:15px;background:#CBD5E1;border:0;position:relative;flex:none;transition:.15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--btn)}.sw.on:after{left:23px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.big-date{font-size:20px;font-weight:700}
.sticky-search{position:sticky;top:calc(52px + var(--sat));z-index:11;background:var(--bg);padding:10px 0 4px}
.sch{position:relative}.sch .ic{position:absolute;left:14px;top:50%;margin-top:-10px;color:var(--t2)}.sch .inp{padding-left:42px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sab));z-index:40;max-width:616px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(15,41,66,.35)}
.updbar span{flex:1}.updbar button{border:0;background:var(--teal);color:#fff;font-weight:700;border-radius:10px;height:38px;padding:0 16px;font-size:14px}
.qa.q4{grid-template-columns:repeat(4,1fr);gap:8px}.qa.q4 button{padding:14px 2px 10px;font-size:11.5px}.qa.q4 .iconbox{width:40px;height:40px;border-radius:12px}
.dhead .brand{display:flex;align-items:center;gap:10px;min-width:0}.dhead .brand .bn{font-size:19px;font-weight:700;line-height:1.1}.dhead .brand .bt{font-size:10.5px;opacity:.8;font-weight:500;letter-spacing:.2px;white-space:nowrap}

</style>

  SY.q[n + ':' + id] = { op, mt: Date.now() };
  metaSet('syncq', SY.q); syKick();
};
function syKick() { clearTimeout(SY.timer); SY.timer = setTimeout(() => syncNow(false), 4000); }
async function syQueueAll() {
  for (const n of SY_STORES.concat(['blobs'])) for (const r of await dbAll(n)) SY.q[n + ':' + r.id] = { op: 'put', mt: Date.now() };
  await metaSet('syncq', SY.q);
}

async function syPush() {
  const keys = Object.keys(SY.q); let done = 0;
  for (let i = 0; i < keys.length; i += 25) {
    const rows = [], sent = [];
    for (const k of keys.slice(i, i + 25)) {
      const it = SY.q[k], p = k.split(':'), n = p[0], id = Number(p[1]);
      const rec = it.op === 'put' ? await dbGet(n, id) : null;
      if (!rec) { rows.push({ k, d: null, mt: it.mt, del: true, dev: SY.cfg.dev }); if (n === 'blobs') await syStorage('DELETE', id).catch(() => { }); }
      else if (n === 'blobs') {
        const up = await syStorage('POST', id, new Blob([await syEnc(new Uint8Array(await rec.blob.arrayBuffer()))]));
        if (!up.ok) throw new Error('Photo upload failed: ' + await syErr(up));
        rows.push({ k, d: await syJ({ type: rec.blob.type }), mt: it.mt, del: false, dev: SY.cfg.dev });
      } else rows.push({ k, d: await syJ(rec), mt: it.mt, del: false, dev: SY.cfg.dev });
      sent.push([k, it.mt]);
    }
    const r = await syReq('/rest/v1/records?on_conflict=user_id,k', { method: 'POST', headers: { 'content-type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
    if (!r.ok) throw new Error(await syErr(r));
    sent.forEach(([k, mt]) => { if (SY.q[k] && SY.q[k].mt === mt) delete SY.q[k]; });
    done += rows.length; await metaSet('syncq', SY.q);
  }
  return done;
}
async function syPull() {
  let applied = 0;
  for (;;) {
    const cur = SY.cfg.cursor ? '&srv=gt.' + encodeURIComponent(SY.cfg.cursor) : '';
    const r = await syReq('/rest/v1/records?select=k,d,mt,del,srv,dev&order=srv.asc&limit=100' + cur);
    if (!r.ok) throw new Error(await syErr(r));
    const rows = await r.json(); if (!rows.length) break;
    for (const row of rows) {
      SY.cfg.cursor = row.srv;
      if (row.k.startsWith('meta:') || row.dev === SY.cfg.dev) continue;
      const qi = SY.q[row.k]; if (qi && qi.mt >= row.mt) continue;
      if (qi) delete SY.q[row.k];
      const p = row.k.split(':'), n = p[0], id = Number(p[1]);
      SY.applying = true;
      try {
        if (row.del) { await dbDel(n, id); freeUrl(id); }
        else if (n === 'blobs') {
          const meta = await syUnJ(row.d); const g = await syStorage('GET', id);
          if (!g.ok) throw new Error('Photo download failed');
          const bytes = await syDec(new Uint8Array(await g.arrayBuffer()));
          await dbPut('blobs', { id, blob: new Blob([bytes], { type: meta.type }) }); freeUrl(id);
        } else await dbPut(n, await syUnJ(row.d));
        applied++;
      } catch (e) { if (!(e && e.name === 'ConstraintError')) throw e; }
      finally { SY.applying = false; }
    }
    await syCfgSave(); await metaSet('syncq', SY.q);
    if (rows.length < 100) break;
  }
  return applied;
}
async function syncNow(manual) {
  if (!SY.cfg || !SY.cfg.on || !SY.key || SY.busy) return;
  SY.busy = true;
  try {
    const got = await syPull(); await syPush();
    SY.cfg.last = new Date().toISOString(); SY.err = ''; await syCfgSave();
    const top = STACK[STACK.length - 1];
    if (got && top && ['home', 'patients', 'followups', 'more'].includes(top.view)) refresh();
    if (manual) toast(got ? 'Synced - ' + got + ' change(s) from cloud' : 'Cloud is up to date');
  } catch (e) { SY.err = e.message || String(e); if (manual) toast(SY.err); }
  finally { SY.busy = false; }
}
async function syLoad() {
  const cfg = await metaGet('syncCfg'); if (!cfg || !cfg.on) return;
  SY.cfg = cfg; SY.key = await metaGet('syncKey'); SY.q = (await metaGet('syncq')) || {};
  if (!SY.key) { SY.cfg = null; return; }
  setTimeout(() => syncNow(false), 3000); syLoops();
}
function syLoops() {
  if (SY.loops) return; SY.loops = true;
  setInterval(() => syncNow(false), 5 * 60 * 1000);
  window.addEventListener('online', () => syncNow(false));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(false); });
}

/* ---- connect / disconnect ---- */
async function syConnect(f) {
  let url = f.url.trim(); try { url = new URL(url).origin; } catch (e) { throw new Error('Project URL is not valid'); }
  const cfg = { url, anon: f.anon.trim(), email: f.email.trim(), dev: crypto.randomUUID(), on: false, cursor: null };
  SY.cfg = cfg;
  const H = { apikey: cfg.anon, 'content-type': 'application/json' }, body = JSON.stringify({ email: cfg.email, password: f.pw });
  let r = await syRaw(url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: H, body }), j = await r.json();
  if (!r.ok) {
    const r2 = await syRaw(url + '/auth/v1/signup', { method: 'POST', headers: H, body }), j2 = await r2.json();
    if (!r2.ok) throw new Error(/already/i.test(JSON.stringify(j2)) ? 'A cloud account for this login ID already exists with a different password. Use the same login ID and password as on your old phone.' : (j2.msg || j2.message || j2.error_description || 'Login failed'));
    if (!j2.access_token) throw new Error('Account created, but email confirmation is ON. In Supabase go to Authentication > Providers > Email, turn off "Confirm email", then connect again.');
    j = j2;
  }
  syTokens(j); cfg.uid = j.user.id; cfg.cpw = f.pw;
  const rs = await (await syReq('/rest/v1/records?select=d&k=eq.meta:salt')).json();
  let salt;
  if (Array.isArray(rs) && rs.length) salt = b64d(rs[0].d);
  else {
    salt = crypto.getRandomValues(new Uint8Array(16));
    const w = await syReq('/rest/v1/records?on_conflict=user_id,k', { method: 'POST', headers: { 'content-type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ k: 'meta:salt', d: b64e(salt), mt: Date.now(), del: false, dev: cfg.dev }]) });
    if (!w.ok) throw new Error((await syErr(w)) + ' - did you run the SQL setup in Supabase?');
  }
  SY.key = await uvbKey(f.pass, salt);
  const chk = await (await syReq('/rest/v1/records?select=d&k=eq.meta:check')).json();
  if (Array.isArray(chk) && chk.length) { try { await syDec(b64d(chk[0].d)); } catch (e) { throw new Error('Wrong sync passphrase for this account'); } }
  else await syReq('/rest/v1/records?on_conflict=user_id,k', { method: 'POST', headers: { 'content-type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ k: 'meta:check', d: b64e(await syEnc(new TextEncoder().encode('ok'))), mt: Date.now(), del: false, dev: cfg.dev }]) });
  const rem = await (await syReq('/rest/v1/records?select=k&k=not.like.meta:*&limit=1')).json();
  return { hasRemote: Array.isArray(rem) && rem.length > 0, hasLocal: (await dbAll('patients')).length > 0 };
}
async function syEnable(mode) {
  /* mode: 'push' (cloud empty) | 'pull' (replace local with cloud) */
  if (mode === 'pull') { SY.applying = true; try { for (const n of SY_STORES.concat(['blobs'])) await dbClear(n); } finally { SY.applying = false; } _urls.forEach(u => URL.revokeObjectURL(u)); _urls.clear(); SY.q = {}; SY.cfg.cursor = null; }
  SY.cfg.on = true; await metaSet('syncKey', SY.key); await syCfgSave();
  if (mode === 'push') await syQueueAll(); else await metaSet('syncq', {});
  SY.busy = false; await syncNow(true);
  syLoops();
}
async function syDisconnect() { if (SY.cfg) SY.cfg.on = false; SY.cfg = null; SY.key = null; SY.q = {}; await metaSet('syncCfg', null); await metaSet('syncKey', null); await metaSet('syncq', {}); }

const SY_SQL = "create table if not exists public.records (\n  user_id uuid not null default auth.uid(),\n  k text not null,\n  d text,\n  mt bigint not null,\n  del boolean not null default false,\n  dev text,\n  srv timestamptz not null default now(),\n  primary key (user_id, k)\n);\ncreate index if not exists records_srv on public.records (user_id, srv);\ncreate or replace function public.touch_srv() returns trigger language plpgsql as $$ begin new.srv := clock_timestamp(); return new; end $$;\ndrop trigger if exists records_touch on public.records;\ncreate trigger records_touch before insert or update on public.records for each row execute function public.touch_srv();\nalter table public.records enable row level security;\ndrop policy if exists own_records on public.records;\ncreate policy own_records on public.records for all to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());\ninsert into storage.buckets (id, name, public) values ('media', 'media', false) on conflict (id) do nothing;\ndrop policy if exists own_media on storage.objects;\ncreate policy own_media on storage.objects for all to authenticated using (bucket_id = 'media' and (storage.foldername(name))[1] = auth.uid()::text) with check (bucket_id = 'media' and (storage.foldername(name))[1] = auth.uid()::text);\n";

/* Cloud login + encryption passphrase derived from the app account, so nothing extra to remember. */
async function syDerive(id, pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = async lbl => new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('urovault-' + lbl + '-v1:' + id), iterations: 150000, hash: 'SHA-256' }, km, 256));
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('urovault-cloud-id-v2:' + id.trim().toLowerCase())));
  return { email: 'u' + Array.from(h.slice(0, 12)).map(x => x.toString(16).padStart(2, '0')).join('') + '@urovault.app', cloudPw: b64e(await bits('cloud')), pass: b64e(await bits('enc')) };
}

/* Re-key cloud data to a new password. oldCpw = cloud password derived from the old password (stored on this device). */
async function syRekey(id, oldPw, newPw) {
  const d = await syDerive(id, newPw);
  const cur = oldPw ? (await syDerive(id, oldPw)).cloudPw : SY.cfg.cpw;
  if (!cur) throw new Error('Cloud login info missing');
  const r = await syReq('/auth/v1/user', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: d.cloudPw, current_password: cur }) });
  if (!r.ok) throw new Error(await syErr(r));
  SY.cfg.cpw = d.cloudPw; await syCfgSave();
  const rs = await (await syReq('/rest/v1/records?select=d&k=eq.meta:salt')).json();
  SY.key = await uvbKey(d.pass, b64d(rs[0].d)); await metaSet('syncKey', SY.key);
  const w = await syReq('/rest/v1/records?on_conflict=user_id,k', { method: 'POST', headers: { 'content-type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ k: 'meta:check', d: b64e(await syEnc(new TextEncoder().encode('ok'))), mt: Date.now(), del: false, dev: SY.cfg.dev }]) });
  if (!w.ok) throw new Error(await syErr(w));
  await syQueueAll(); SY.busy = false; await syncNow(false);
  if (SY.err) throw new Error(SY.err);
}

    const st = $('.stage', v); if (!st || !$('img', st)) return;
    const ptrs = new Map(); let d0 = 0, s0 = 1, last = null, sx = 0, moved = 0, lastTap = 0;
    st.onpointerdown = e => { st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); s0 = sc; } last = { x: e.clientX, y: e.clientY }; sx = e.clientX; moved = 0; };
    st.onpointermove = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; sc = Math.min(6, Math.max(1, s0 * Math.hypot(a.x - b.x, a.y - b.y) / d0)); if (sc === 1) { tx = 0; ty = 0; } apply(); }
      else if (sc > 1 && last) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
      if (last) { moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y); last = { x: e.clientX, y: e.clientY }; }
    };
    st.onpointerup = st.onpointercancel = e => {
      const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId);
      if (wasOne && sc === 1 && list.length > 1 && Math.abs(e.clientX - sx) > 70) { i = (i + (e.clientX < sx ? 1 : list.length - 1)) % list.length; show(); return; }
      if (wasOne && moved < 8) { const now = Date.now(); if (now - lastTap < 300) { sc = sc > 1 ? 1 : 2.5; tx = 0; ty = 0; apply(); lastTap = 0; } else lastTap = now; }
    };
  }
  v.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const a = b.dataset.v, m = list[i];
    if (a === 'close') close();
    else if (a === 'prev') { i = (i + list.length - 1) % list.length; show(); }
    else if (a === 'next') { i = (i + 1) % list.length; show(); }
    else if (a === 'share') { const d = await dbGet('blobs', m.id); if (d) { const r = await shareOrSave(d.blob, m.name || 'file'); if (r === 'downloaded') toast('Saved to downloads'); } }
    else if (a === 'del') {
      if (await confirmDlg('Delete this item?', 'This cannot be undone.', 'Delete', true)) {
        await Repo.delMedia(m); changed = true; list.splice(i, 1);
        if (!list.length) { close(); return; }
        i = Math.min(i, list.length - 1); show();
      }
    } else if (a === 'edit') {
      sheet('<h3>Edit details</h3><div class="lbl">Category</div><div class="chips wrapchips" id="ecats">' + MEDIA_CATS.map(c => '<button class="chip sm ' + (c === m.category ? 'on' : '') + '" data-c="' + c + '">' + c + '</button>').join('') + '</div>' +
        '<div class="lbl">Caption</div><input class="inp" id="ecap" value="' + esc(m.caption || '') + '" placeholder="Optional"><div style="height:16px"></div><button class="btn" id="esave">Save</button>', (s, cl) => {
        let cat = m.category;
        $('#ecats', s).onclick = ev => { const c = ev.target.closest('[data-c]'); if (!c) return; cat = c.dataset.c; $$('#ecats .chip', s).forEach(x => x.classList.toggle('on', x === c)); };
        $('#esave', s).onclick = async () => { await Repo.updMedia(m.id, cat, $('#ecap', s).value); m.category = cat; m.caption = nn($('#ecap', s).value); changed = true; cl(); show(); };
      });
    }
  });
  show();
}

/* ---------- in-app updates ---------- */
let UPDATE_AVAILABLE = false;
async function checkUpdate(manual) {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    UPDATE_AVAILABLE = j.build !== BUILD_ID;
    showUpdateBar();
    if (manual) toast(UPDATE_AVAILABLE ? 'Update available' : 'You are on the latest version');
    return UPDATE_AVAILABLE;
  } catch (e) { if (manual) toast('Could not check - are you online?'); return false; }
}
function showUpdateBar() {
  let b = $('#updbar');
  if (!UPDATE_AVAILABLE) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement('div'); b.id = 'updbar'; b.className = 'updbar';
  b.innerHTML = '<span>New version available</span><button>Update now</button>';
  b.querySelector('button').onclick = applyUpdate;
  document.body.appendChild(b);
}
async function applyUpdate() {
  const bz = busy('Updating...');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    try { await fetch('index.html', { cache: 'reload' }); await fetch('./', { cache: 'reload' }); } catch (e) { /* offline fallback below */ }
  } catch (e) { /* ignore */ }
  location.reload();
}

/* ---------------- add / edit patient ---------------- */
Views.addPatient = async ({ id }) => {
  const ex = id ? await Repo.patient(id) : null;
  let draft = null;
  if (!ex) { draft = await metaGet('draft'); if (draft && !(draft.uhid || draft.name || draft.cc)) draft = null; }
  const v = ex || draft || {};
  return {
    html: hdr(ex ? 'Edit Patient' : 'New Patient') +
      wrapPage((draft ? '<div class="banner">' + ic('history', 16) + ' Draft restored <button data-act="discard">Discard</button></div>' : '') +
        '<label class="lbl" style="margin-top:6px">UHID <i>*</i></label><input class="inp uhid" id="uhid" autocapitalize="characters" autocomplete="off" placeholder="e.g. 2026/00123" value="' + esc(v.uhid || '') + '"><div id="dup"></div>' +
        '<label class="lbl">Patient name <i>*</i></label><input class="inp" id="name" autocomplete="off" placeholder="Full name" value="' + esc(v.name || '') + '">' +
        '<div class="two"><div><label class="lbl">Age <i>*</i></label><input class="inp" id="age" type="number" inputmode="numeric" min="0" max="120" placeholder="Yrs" value="' + esc(v.age == null ? '' : v.age) + '"></div>' +
        '<div><label class="lbl">Sex <i>*</i></label><div class="seg" id="sex">' + ['Male', 'Female', 'Other'].map(s => '<button type="button" data-s="' + s + '" class="' + (v.sex === s ? 'on' : '') + '">' + s + '</button>').join('') + '</div></div></div>' +
        '<label class="lbl">Chief complaints <i>*</i></label><textarea class="ta" id="cc" placeholder="Presenting complaints, duration">' + esc(v.cc || '') + '</textarea>' +
        '<label class="lbl">Mobile (optional)</label><input class="inp" id="mobile" type="tel" inputmode="tel" placeholder="For quick call" value="' + esc(v.mobile || '') + '">', true) +
      '<div class="bar"><div class="in"><button class="btn" data-act="save">' + (ex ? 'Save Changes' : 'Save &amp; Continue') + '</button></div></div>',
    acts: {
      discard: async () => { await metaSet('draft', null); replace('addPatient', {}); },
      save: async () => {
        const f = { uhid: $('#uhid').value.trim(), name: $('#name').value.trim(), age: $('#age').value.trim(), cc: $('#cc').value.trim() };
        const sex = (($('#sex .on') || {}).dataset || {}).s;
        let bad = false;
        const mark = (sel, cond) => { const el = $(sel); el.classList.toggle('err', !cond); if (!cond) bad = true; };
        mark('#uhid', !!f.uhid); mark('#name', !!f.name); mark('#cc', !!f.cc);
        const ageN = Number(f.age); mark('#age', f.age !== '' && Number.isInteger(ageN) && ageN >= 0 && ageN <= 120);
        $('#sex').classList.toggle('err', !sex); if (!sex) bad = true;
        if (bad) { toast('Please fill the highlighted fields'); const e = $('.err'); e && e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        const dup = await Repo.uhidTaken(f.uhid, id);
        if (dup) { toast('UHID already exists'); return; }
        try {
          const pid = await Repo.savePatient(Object.assign({}, ex || { dx: [], addDx: null }, { id: id, uhid: f.uhid, name: f.name, age: ageN, sex, cc: f.cc, mobile: nn($('#mobile').value) }));
          if (!ex) { await metaSet('draft', null); replace('dx', { pid, isNew: true }); }
          else { toast('Saved'); back(); }
        } catch (e) { toast(/Constraint/i.test(String(e && e.name)) ? 'UHID already exists' : 'Could not save: ' + (e && e.message)); }
      }
    },
    bind: root => {
      $('#sex').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; $$('#sex button').forEach(x => x.classList.toggle('on', x === b)); $('#sex').classList.remove('err'); saveDraft(); };
      const chk = debounce(async () => {
        if (!$('#uhid')) return; const v2 = $('#uhid').value; const d = v2.trim() ? await Repo.uhidTaken(v2, id) : null;
        $('#uhid').classList.toggle('err', !!d);
        $('#dup').innerHTML = d ? '<div class="dup">' + ic('alert', 18) + '<span>UHID already registered to <b>' + esc(d.name) + '</b></span><button data-act="openDup" data-id="' + d.id + '">Open</button></div>' : '';
      }, 250);
      const saveDraft = debounce(async () => {
        if (id || !$('#uhid')) return;
        await metaSet('draft', { uhid: $('#uhid').value, name: $('#name').value, age: $('#age').value, cc: $('#cc').value, mobile: $('#mobile').value, sex: (($('#sex .on') || {}).dataset || {}).s || null });
      }, 400);
      root.addEventListener('input', e => { e.target.classList.remove('err'); if (e.target.id === 'uhid') chk(); saveDraft(); });
      if (v.uhid) chk();
      if (!ex && !v.uhid) setTimeout(() => { const u = $('#uhid'); u && u.focus(); }, 250);
    }
  };
};

/* ---------------- diagnosis selection ---------------- */
Views.dx = async ({ pid, isNew }) => {
  const p = await Repo.patient(pid);
  const sel = new Map((p.dx || []).map(d => [d.name, d.lat || null]));
  let other = p.addDx || '';
  const grid = () => '<div class="two" style="grid-template-columns:1fr 1fr;gap:10px">' + DX_OPTIONS.map(o =>
    '<div class="card dxcard ' + (sel.has(o.name) ? 'sel' : '') + '" data-act="toggle" data-n="' + esc(o.name) + '" style="margin:0;padding:12px"><div class="iconbox">' + dxIc(o.name, 26) + '</div><div class="nm" style="font-size:14px">' + esc(o.name) + '</div>' +
    (sel.has(o.name) ? '<span class="chk r on" style="width:22px;height:22px">' + ic('check', 14) + '</span>' : '') + '</div>').join('') + '</div>';
  const subs = () => {
    let h = '';
    DX_OPTIONS.forEach(o => {
      if (!sel.has(o.name)) return;
      if (o.paired) h += '<div class="card" style="margin-top:10px"><b>' + esc(o.name) + '</b> <span class="small">- laterality</span><div class="seg" style="margin-top:8px" data-lat="' + esc(o.name) + '">' + LATERALITY.map(l => '<button type="button" data-l="' + l + '" class="' + (sel.get(o.name) === l ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
      if (o.name === 'Other') h += '<div class="card" style="margin-top:10px"><b>Other diagnosis</b><input class="inp" id="oth" style="margin-top:8px" placeholder="Specify diagnosis" value="' + esc(other) + '"></div>';
    });
    return h;
  };
  return {
    html: hdr('Diagnosis') + wrapPage('<div class="phead" style="margin-bottom:6px"><div class="avatar">' + esc(initials(p.name)) + '</div><div><div class="t-name">' + esc(p.name) + '</div><div class="t-sub"><b>' + esc(p.uhid) + '</b></div></div></div>' +
      '<div class="small" style="margin:10px 2px 12px">Tap to select. You can choose more than one.</div><div id="dxg">' + grid() + '</div><div id="dxs">' + subs() + '</div>', true) +
      '<div class="bar"><div class="in"><div class="row">' + (isNew ? '<button class="btn o" style="height:52px" data-act="skip">Skip</button>' : '') + '<button class="btn" data-act="save">Save</button></div></div></div>',
    acts: {
      toggle: el => { const n = el.dataset.n; if (sel.has(n)) sel.delete(n); else sel.set(n, null); $('#dxg').innerHTML = grid(); $('#dxs').innerHTML = subs(); },
      skip: () => replace('profile', { id: pid }),
      save: async () => {
        const o = $('#oth'); if (o) other = o.value.trim();
        const dx = [...sel.entries()].map(([name, lat]) => lat ? { name, lat } : { name });
        await Repo.setDx(pid, dx, sel.has('Other') ? other : null);
        if (isNew) replace('profile', { id: pid }); else { toast('Diagnosis saved'); back(); }
      }
    },
    bind: root => {
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-l]'); if (!b) return;
        const n = b.parentElement.dataset.lat; sel.set(n, sel.get(n) === b.dataset.l ? null : b.dataset.l);
        $$('button', b.parentElement).forEach(x => x.classList.toggle('on', x === b && sel.get(n) === b.dataset.l));
      });
    }
  };
};

        (f.notes ? '<div class="pre small" style="margin-top:6px;color:var(--navy)">' + esc(f.notes) + '</div>' : '') + (f.nextDate ? '<div class="small" style="margin-top:6px">Next planned: ' + fmt(f.nextDate) + '</div>' : '') + '</div>').join('') : '<div class="card small" style="text-align:center">No visits recorded yet</div>');
  }
  const barFor = () => tab === 'media' ? '<div class="bar"><div class="in"><button class="btn" data-act="addMedia">' + ic('plus', 20) + ' Add Photo or File</button></div></div>' :
    tab === 'surgery' ? '<div class="bar"><div class="in"><button class="btn" data-act="addSurg">' + ic('plus', 20) + ' Add Surgery</button></div></div>' :
    tab === 'fu' ? '<div class="bar"><div class="in"><button class="btn" data-act="visit">' + ic('clip2', 20) + ' Record Visit</button></div></div>' : '';
  async function fill() {
    const c = $('#tabc'); if (!c) return;
    const html = tab === 'overview' ? await overview() : tab === 'media' ? await mediaTab() : tab === 'inv' ? await invTab() : tab === 'surgery' ? await surgeryTab() : await fuTab();
    c.innerHTML = html; $('#tabbar').innerHTML = barFor();
    const tw = $('#tabw'); if (tw) tw.innerHTML = tabsHtml();
    c.parentElement.classList.toggle('nobar', !barFor());
  }
  const attGroup = async (ref, k, type) => {
    const media = (await Repo.media(pid)).filter(m => m.refType === type && m.refId === ref);
    openViewer(media, k, fill);
  };

  const acts = {
    ptab: el => { tab = el.dataset.t; window.scrollTo(0, 0); fill(); },
    mcat: el => { mcat = el.dataset.c; fill(); },
    menu: () => sheet('<h3>' + esc(p.name) + '</h3><div style="height:8px"></div>' +
      [['editP', 'edit', 'Edit patient details'], ['editDx', 'sliders', 'Change diagnosis'], ['summary', 'printer', 'Print / share summary'], ['delP', 'trash', 'Delete patient']].map(r => '<div class="mrow" data-m="' + r[0] + '" style="padding:14px 4px;border-bottom:1px solid var(--bd);' + (r[0] === 'delP' ? 'color:var(--redd)' : '') + '">' + ic(r[1], 20) + '<div class="grow t">' + r[2] + '</div></div>').join(''),
      (s, close) => { s.onclick = async e => { const m = e.target.closest('[data-m]'); if (!m) return; close(); await acts[m.dataset.m](); }; }),
    editP: () => go('addPatient', { id: pid }),
    editDx: () => go('dx', { pid }),
    summary: () => go('summary', { id: pid }),
    addNote: () => sheet('<h3>Clinical note</h3><textarea class="ta" id="nt" placeholder="Write a note" style="margin-top:10px"></textarea><div style="height:14px"></div><button class="btn" id="ns">Save note</button>', (s, close) => {
      setTimeout(() => $('#nt', s).focus(), 200);
      $('#ns', s).onclick = async () => { const v = $('#nt', s).value; if (!v.trim()) return toast('Write something first'); await Repo.addNote(pid, v); close(); fill(); };
    }),
    delNote: async el => { if (await confirmDlg('Delete note?', 'This cannot be undone.', 'Delete', true)) { await Repo.delNote(+el.dataset.id); fill(); } },
    /* media */
    openMedia: el => { const shown = mcat === 'All' ? mediaCache : mediaCache.filter(m => m.category === mcat); openViewer(shown, shown.findIndex(m => m.id === +el.dataset.id), fill); },
    addMedia: () => mediaSheet(pid, fill),
    openAtt: el => attGroup(+el.dataset.ref, +el.dataset.k, 'investigation'),
    /* investigations */
    addInv: () => { tab = 'inv'; fill(); window.scrollTo(0, 0); },
    addInvN: el => invSheet(pid, { name: el.dataset.n }, fill),
    editInv: async el => invSheet(pid, { rec: await dbGet('investigations', +el.dataset.id) }, fill),
    /* surgery */
    addSurg: () => go('surgeryForm', { pid }),
    editSurg: el => go('surgeryForm', { pid, id: +el.dataset.id }),
    /* follow-ups */
    visit: () => go('visitForm', { pid }),
    editVisit: el => go('visitForm', { pid, id: +el.dataset.id }),
    quickSched: async el => { await Repo.schedule(pid, iso(nextDateFor(el.dataset.i, today()))); toast('Follow-up scheduled'); fill(); },
    chgDate: async () => {
      const pend = (await Repo.fus(pid)).find(f => !f.completed);
      sheet('<h3>Change follow-up date</h3><input class="inp" type="date" id="cd" style="margin-top:12px" value="' + (pend ? pend.date : iso(today())) + '"><div class="chips wrapchips" style="margin-top:12px">' + INTERVALS.map(i => '<button class="chip sm" data-i="' + i + '">' + i + '</button>').join('') + '</div><div style="height:16px"></div><button class="btn" id="cs">Save</button>', (s, close) => {
        s.addEventListener('click', e => { const c = e.target.closest('[data-i]'); if (c) $('#cd', s).value = iso(nextDateFor(c.dataset.i, today())); });
        $('#cs', s).onclick = async () => { const v = $('#cd', s).value; if (!v) return toast('Pick a date'); await Repo.schedule(pid, v); close(); toast('Follow-up updated'); fill(); };
      });
    },
    cancelFu: async el => { if (await confirmDlg('Cancel follow-up?', 'The scheduled follow-up will be removed.', 'Remove', true)) { await Repo.delFu(+el.dataset.id); fill(); } }
  };
  /* delete patient: return to the list */
  acts.delP = async () => {
    if (!await confirmDlg('Delete patient?', 'This permanently deletes ' + p.name + ' with all investigations, media, surgeries and follow-ups.', 'Delete', true)) return;
    await withBusy('Deleting...', () => Repo.deletePatient(pid));
    toast('Patient deleted');
    if (STACK.length > 1) back(); else setTab('patients');
  };
  return {
    html: hdr('Patient', { right: '<button class="ib" data-act="menu" aria-label="Menu">' + ic('more', 22) + '</button>' }) + head + '<div class="tabs" id="tabw" style="margin-top:14px">' + tabsHtml() + '</div>' +
      '<div class="wrap page"><div id="tabc"></div></div><div id="tabbar"></div>',
    acts, bind: () => fill()
  };
};

/* ---------------- investigation sheet ---------------- */
async function invSheet(pid, o, done) {
  const rec = o.rec || null;
  const name0 = rec ? rec.name : o.name;
  const existing = rec ? (await Repo.media(pid)).filter(m => m.refType === 'investigation' && m.refId === rec.id) : [];
  sheet('<h3>' + (rec ? 'Edit ' : 'Add ') + esc(name0) + '</h3>' +
    (name0 === 'Other' && !rec ? '<div class="lbl">Test name <i>*</i></div><input class="inp" id="iname" placeholder="e.g. Uroflowmetry">' : '') +
    '<div class="lbl">Date <i>*</i></div><input class="inp" type="date" id="idate" value="' + (rec ? rec.date : iso(today())) + '">' +
    '<div class="lbl">Result / notes</div><textarea class="ta" id="inotes" style="min-height:90px" placeholder="Key values, impression">' + esc(rec ? rec.notes || '' : '') + '</textarea>' +
    (existing.length ? '<div class="lbl">Attached</div><div class="thumbs" id="iex">' + existing.map((m, k) => '<div class="th ' + (m.kind === 'image' ? '' : 'file') + '">' + (m.kind === 'image' && m.thumb ? '<img alt="" src="' + m.thumb + '">' : ic('file', 22)) + '<button class="x red" data-del="' + m.id + '">' + ic('x', 12) + '</button></div>').join('') + '</div>' : '') +
    attachHtml('iattach', 'Attach report / images') + '<div style="height:16px"></div><button class="btn" id="isave">Save</button>' +
    (rec ? '<div style="height:10px"></div><button class="btn o" style="color:var(--redd);border-color:var(--red)" id="idel">Delete this record</button>' : ''), (s, close) => {
    const st = bindAttach($('#iattach', s));
    const ex = $('#iex', s);
    if (ex) ex.onclick = async e => { const b = e.target.closest('[data-del]'); if (!b) return; if (await confirmDlg('Remove attachment?', 'This cannot be undone.', 'Remove', true)) { const m = existing.find(x => x.id === +b.dataset.del); await Repo.delMedia(m); b.parentElement.remove(); } };
    $('#isave', s).onclick = async () => {
      const name = rec ? rec.name : (name0 === 'Other' ? ($('#iname', s).value.trim() || '') : name0);

      if (!name) return toast('Enter the test name');
      if (!date) return toast('Pick a date');
      await withBusy('Saving...', async () => {
        let id = rec ? rec.id : null;
        if (rec) await Repo.updInv(rec.id, date, $('#inotes', s).value); else id = await Repo.addInv(pid, name, date, $('#inotes', s).value);
        await saveStaged(st, { pid, category: invCat(name), takenAt: date, refType: 'investigation', refId: id, caption: name });
      });
      close(); toast('Saved'); done();
    };
    const d = $('#idel', s);
    if (d) d.onclick = async () => { if (await confirmDlg('Delete ' + rec.name + '?', 'The record and its attachments will be deleted.', 'Delete', true)) { await Repo.delInv(rec.id); close(); done(); } };
  });
}

let _bk = null; // prepared backup {blob,name}

function askPw(title, msg, verify) {
  return new Promise(res => {
    sheet('<h3>' + title + '</h3><div class="small" style="margin-bottom:8px">' + msg + '</div><label class="lbl">UroVault password</label><input class="inp" id="pw1" type="password" autocomplete="off"><div class="ferr" id="pwe"></div><div style="height:12px"></div><button class="btn" id="pwok">Continue</button><button class="linkbtn" style="display:block;margin:12px auto 0" id="pwx">Cancel</button>', (s, close) => {
      let done = false; const mo = new MutationObserver(() => { if (!document.body.contains(s)) fin(null); }); const fin = v => { if (done) return; done = true; mo.disconnect(); close(); res(v); };
      mo.observe(document.body, { childList: true });
      $('#pwx', s).onclick = () => fin(null);
      $('#pwok', s).onclick = async () => {
        const v = $('#pw1', s).value, e = $('#pwe', s);
        if (!v) return e.textContent = 'Enter your password';
        if (verify) { const a = await Auth.acct(); if (!await Auth.verify(a.id, v)) return e.textContent = 'Incorrect password'; if (v.length < 8) return e.textContent = 'Password must be 8+ characters to encrypt data. Change it in Settings > Change password first.'; }
        fin(v);
      };
    });
  });
}

Views.backup = async () => {
  const [last, c] = await Promise.all([metaGet('lastBackup'), Repo.counts()]);
  return {
    html: hdr('Backup & Restore') + wrapPage(
      '<div class="card"><div class="kv"><span>Patients</span><span>' + c.patients + '</span></div><div class="kv"><span>Media items</span><span>' + c.media + '</span></div><div class="kv"><span>Last backup</span><span>' + (last ? fmtDT(last) : 'Never') + '</span></div></div>' +
      ((SY.cfg && SY.cfg.on) ? '<div class="card" style="background:var(--greent);border-color:#6EE7B7;display:flex;gap:10px">' + ic('check', 20) + '<div class="small" style="color:var(--greend)"><b>Cloud sync is on.</b> Your data is also saved encrypted in the cloud. A backup file is an extra safety copy, encrypted with your password.</div></div>' : '<div class="card" style="background:var(--ambert);border-color:#FCD34D;display:flex;gap:10px">' + ic('alert', 20) + '<div class="small" style="color:var(--amberd)"><b>Your data lives only on this phone.</b> If Safari storage is cleared or the app is deleted, it is gone. Turn on cloud sync in Settings, or back up regularly. Backup files are encrypted with your password.</div></div>') +
      '<div class="sec"><h2>Export backup</h2></div><div id="bkbox"><button class="btn" data-act="prep">' + ic('download', 20) + ' Create backup file</button></div>' +
      '<div class="sec"><h2>Restore</h2></div><div class="small" style="margin-bottom:8px">Restoring replaces everything currently on this device.</div><button class="btn o" data-act="restore">' + ic('upload', 18) + ' Choose backup file</button>'),
    acts: {
      prep: async () => {
        const pass = await askPw('Encrypt backup', 'The backup file is encrypted with your UroVault password. Use the same password to restore it.', true);
        if (pass === null) return;
        const b = busy('Preparing backup...');
        try {
          let blob = await Repo.buildBackup((k, n) => b.set('Packing images ' + k + ' / ' + n));
          b.set('Encrypting...'); blob = await encryptBlob(blob, pass);
          _bk = { blob, name: 'urovault-backup-' + iso(today()) + '.uvb' };
        } catch (e) { b.done(); return alertDlg('Backup failed', e.message); }
        b.done();
        $('#bkbox').innerHTML = '<div class="card tap" style="display:flex;gap:10px;align-items:center;background:var(--greent);border-color:#6EE7B7">' + ic('check', 22) + '<div><b>Backup ready</b><div class="small">' + (_bk.blob.size / 1048576).toFixed(1) + ' MB</div></div></div><button class="btn" data-act="saveBk">' + ic('share', 20) + ' Save / Share backup</button>';
      },
      saveBk: async () => {
        if (!_bk) return;
        const r = await shareOrSave(_bk.blob, _bk.name);
        if (r !== 'cancelled') { await metaSet('lastBackup', new Date().toISOString()); await Repo.audit('export', 'backup'); toast(r === 'shared' ? 'Backup shared' : 'Backup saved to downloads'); }
      },
      restore: async () => {
        const fs = await pickFiles({ accept: '' }); if (!fs.length) return;
        const enc = await isEncryptedBackup(fs[0]); let src = fs[0];
        if (enc) { const pw = await askPw('Backup password', 'Enter the UroVault password that was set when this backup was made.', false); if (pw === null) return; const bz = busy('Decrypting...'); try { src = await decryptBlob(fs[0], pw); } catch (e) { bz.done(); return alertDlg('Cannot open backup', e.message); } bz.done(); }
        if (!await confirmDlg('Replace all data?', 'Everything on this device will be replaced with the backup (' + fs[0].name + ').', 'Restore', true)) return;
        const b = busy('Restoring...');
        try { await Repo.restoreBackup(await src.text()); b.done(); toast('Restore complete'); setTab('home'); }
        catch (e) { b.done(); alertDlg('Restore failed', e.message || 'Invalid file'); }
      }
    }
  };
};

  catch (x) { SY.cfg = null; SY.key = null; return alertDlg('Cloud sync failed', x.message || 'Failed'); }
  let mode = 'push';
  if (st.hasRemote && st.hasLocal) { if (!await confirmDlg('Cloud already has data', 'This device also has data. Use the cloud copy and REPLACE what is on this phone? (Take a backup first if unsure.)', 'Use cloud data', true)) { SY.cfg = null; SY.key = null; return; } mode = 'pull'; }

    else if (a.stage === 'T1' && g === 'G2' && rf >= 2) rg = 'Very high';
    else if (a.stage === 'T1' && hg && rf >= 1) rg = 'Very high';
    else rg = 'High';
  } else if (a.stage === 'T1' && hg) rg = rf === 3 ? 'Very high' : 'High';
  else if (((a.stage === 'Ta' && (g === 'LG' || g === 'G2')) || (a.stage === 'T1' && g === 'G1')) && rf === 3) rg = 'High';
  else if (((a.stage === 'Ta' && hg) || (a.stage === 'T1' && g === 'LG')) && rf >= 2) rg = 'High';
  else if (a.stage === 'T1' && g === 'G2' && rf >= 1) rg = 'High';
  else if (lg && ((rf === 0) || (a.stage === 'Ta' && rf <= 1))) rg = 'Low';

    if (!a.nac) out.miss.push('Neoadjuvant therapy given?'); if (!a.pt) out.miss.push('pT'); if (!a.pn) out.miss.push('pN');
    if (hi && a.nac === 'No') rows.push(R('Adjuvant cisplatin-based combination chemotherapy for pT3/4 and/or pN+ if no neoadjuvant systemic therapy was given.', 'Strong - MIBC §6.5.2'));
    if ((hi || a.nac === 'Yes') && a.cisok && a.cisok !== 'Yes') rows.push(R('High-risk disease (>= ypT2N0 after NAC, or pT3/4 and/or pN+) and not eligible for / declined cisplatin: adjuvant nivolumab (EMA approval only for PD-L1 tumour cell expression >= 1%).', 'Strong - MIBC §6.5.2'));
    if (a.pt === 'pT3' || a.pt === 'pT4' || a.pn === 'pN+' || a.margin === 'Positive') rows.push(R('Adjuvant radiotherapy to cystectomy bed and pelvic nodes can be offered for pT3b-4, positive nodes or positive margins - improves locoregional relapse-free survival, not overall survival.', 'Weak - MIBC §6.6.2'));
    if (!rows.length && a.pt && a.pn) rows.push(R('No adjuvant systemic recommendation triggered by the entered pathology.', 'MIBC §6.5.2'));
    out.secs.push(S('Adjuvant therapy', rows));
    out.secs.push(S('Post-operative', [R('Pharmacological VTE prophylaxis (e.g. LMWH) from day 1 for at least 4 weeks.', 'Strong - MIBC §6.7')]));
    return out;
  }
  const g = Number(a.gfr), has = !!a.gfr;
  const rows = [];
  if (!has) { out.miss.push('eGFR'); rows.push(R('Enter eGFR to select the perioperative systemic option.', 'MIBC §6.5')); }
  else if (g >= 40) { rows.push(R('Perioperative cisplatin/gemcitabine plus durvalumab for cisplatin-eligible patients (eGFR >= 40 allowed) who can receive immunotherapy.', 'Strong - MIBC §6.5.1')); rows.push(R('Alternative: neoadjuvant cisplatin-based combination chemotherapy.', 'Strong - MIBC §6.5.1')); }
  else rows.push(R('Cisplatin-ineligible (eGFR < 40): perioperative enfortumab vedotin plus pembrolizumab. Do not give carboplatin-based neoadjuvant chemotherapy.', 'Strong - MIBC §6.5.1'));
  out.secs.push(S('Perioperative systemic therapy (cT2-T4a N0-1 M0)', rows));
  const tmtOk = a.stage !== 'T4a' && a.stage !== 'T3' && a.multi === 'Solitary, unifocal' && a.xcis === 'No' && (a.hydro === 'None' || a.hydro === 'Unilateral') && a.bfun === 'Good';
  const tmtAns = a.multi && a.xcis && a.hydro && a.bfun;
  out.secs.push(S('Definitive local treatment', [
    R('Radical cystectomy with standard (not extended) lymph node dissection, or bladder-preserving trimodality therapy (TMT) for eligible patients - both are preferred over radiotherapy alone.', 'Strong - MIBC §6.7, §6.8'),
    R(tmtAns ? (tmtOk ? 'TMT profile fits: solitary unifocal tumour, no extensive CIS, no/unilateral hydronephrosis, good bladder function. Stage T3a at most - confirm substaging.' : 'TMT profile is less favourable from your inputs (best suited: solitary unifocal cT2-T3a, no extensive CIS, no/unilateral hydronephrosis, good bladder function). Consider it mainly if unfit/unwilling for cystectomy.') : 'Enter tumour pattern, CIS, hydronephrosis and bladder function to check TMT suitability.', 'MIBC §6.8.1'),
    R('Do not delay radical cystectomy beyond 3 months unless neoadjuvant chemotherapy is given.', 'Strong - MIBC §6.7.4'),
    R('If TMT is chosen, lifelong bladder monitoring after treatment is essential. Salvage cystectomy for non-responders / muscle-invasive recurrence.', 'Strong - MIBC §6.8, §6.7.1.c')]));
  out.secs.push(S('Cystectomy planning', [
    R('Open vs robotic: choose centres and surgeons by experience, not technique; inform the patient about pros and cons.', 'Strong - MIBC §6.7.4'),
    R('Hospital volume: at least 20 radical cystectomies per year.', 'Strong - MIBC §6.7.9'),
    R('No preoperative bowel preparation; use fast-track pathways; LMWH from day 1 for at least 4 weeks.', 'Strong - MIBC §6.7'),
    a.urethra === 'Yes' ? R('Invasive tumour in the urethra / at the urethral dissection level: do NOT offer an orthotopic neobladder.', 'Strong - MIBC §6.7.5') : R('Orthotopic neobladder only if no invasive urethral tumour at the level of dissection; sexual-preserving techniques only for motivated, eligible male patients with organ-confined disease.', 'Strong - MIBC §6.7.2, §6.7.5'),
    R('Do not offer preoperative radiotherapy.', 'Strong - MIBC §6.6.1')]));
  return out;
}

/* ---------------- prostate ---------------- */
function pcaRisk(a) {
  const miss = [];
  if (a.psa === undefined || a.psa === '') miss.push('PSA'); if (!a.gg) miss.push('ISUP grade group'); if (!a.ct || a.ct === 'Not assessed') miss.push('Clinical T'); if (!a.m || a.m === 'Not assessed') miss.push('Metastasis status'); if (!a.cn || a.cn === 'Not assessed') miss.push('Node status');
  const psa = Number(a.psa), gg = Number(a.gg);
  let rg = null, la = false;
  if (a.m === 'M1') return { rg: 'Metastatic', miss: miss.filter(x => x === 'PSA'), la };
  if (a.psa === undefined || a.psa === '' || !a.gg || !a.ct || a.ct === 'Not assessed') return { rg: null, miss, la };
  if (a.ct === 'cT3-4' || a.cn === 'cN1') { rg = 'High'; la = true; }
  else if (gg >= 4 || psa > 20) rg = 'High';
  else if (gg === 3 || (gg === 2 && psa >= 10)) rg = 'Unfavourable intermediate';
  else if (gg === 2 || (gg === 1 && psa >= 10)) rg = 'Favourable intermediate';
  else rg = 'Low';
  return { rg, miss, la };
}
function prostateAssess(a, p) {
  const r = pcaRisk(a), out = { title: 'Prostate cancer', badge: null, secs: [], miss: r.miss.slice() };
  if (!r.rg) { out.secs.push(S('Risk group', [R('EAU risk group cannot be assigned yet. Answer: ' + r.miss.join(', ') + '.', 'PCa Table 4.3')])); return out; }
  out.badge = r.rg === 'Metastatic' ? 'Metastatic (M1)' : 'EAU risk: ' + r.rg + (r.la ? ' (locally advanced)' : '');
  const le = a.le;
  if (r.rg === 'Metastatic') {
    const rows = [R('Discuss in a multidisciplinary team.', 'Strong - PCa §6.6.8'), R('Immediate ADT for symptomatic M1 disease. Short-term older-generation AR antagonist with the first LHRH agonist to reduce flare. LHRH antagonist or orchiectomy if impending complications (cord compression, outlet obstruction). No AR-antagonist monotherapy.', 'Strong / Weak - PCa §6.6.8'),
      R('Do not give ADT alone as first presentation if fit for combination therapy with at least 1 year life expectancy: add abiraterone + prednisone, apalutamide, enzalutamide or rezvilutamide (darolutamide: weak).', 'Strong - PCa §6.6.8')];
    if (a.doc === 'Fit') rows.push(R('Docetaxel only in combination with ADT plus abiraterone or darolutamide (triplet).', 'Strong - PCa §6.6.8')); else if (!a.doc) out.miss.push('Docetaxel fitness');
    if (a.vol === 'Low volume') rows.push(R('Low-volume (CHAARTED) first-presentation M1: add prostate radiotherapy (up to 72 Gy equivalent) to ADT.', 'Strong - PCa §6.6.8')); else if (!a.vol || a.vol === 'Unknown') out.miss.push('Disease volume');
    rows.push(R(a.hrr === 'Done' ? 'HRR result available: niraparib can be added to ADT + abiraterone if aberration present (M1).' : 'Test for somatic or germline HRR aberrations (niraparib + abiraterone option).', 'Weak - PCa §6.6.8'));
    rows.push(R('No ADT plus surgery for M1 outside trials; metastasis-directed therapy only within trials / prospective cohorts.', 'Strong - PCa §6.6.8'));
    out.secs.push(S('First-line hormone-sensitive metastatic', rows));
    out.secs.push(S('Supportive care', [R('Assess osteoporosis risk and do DEXA when starting long-term ADT; bone protection with calcium/vitamin D; treat painful bone metastases early (radiotherapy, analgesia).', 'Strong - PCa §6.6.8'), R('Spinal cord compression: immediate high-dose corticosteroids, assess for surgery +/- radiation; radiation alone if surgery unsuitable.', 'Strong - PCa §6.6.8')]));
    return out;
  }
  const st = { 'Low': 'Do not use additional imaging for staging.', 'Favourable intermediate': 'Do not use additional imaging for staging.', 'Unfavourable intermediate': 'PSMA PET/CT if available (weak), otherwise at least cross-sectional abdominopelvic imaging plus bone scan.', 'High': 'Metastatic screening with PSMA PET/CT if available, or at least cross-sectional abdominopelvic imaging plus bone scan.' }[r.rg];
  out.secs.push(S('Staging', [R(st, (r.rg === 'Low' || r.rg === 'Favourable intermediate' ? 'Strong' : r.rg === 'High' ? 'Strong' : 'Weak') + ' - PCa §5.8.5'), R('Pre-biopsy MRI can be used for local staging information.', 'Weak - PCa §5.8.5')]));
  const rows = [];
  if (!le || le === 'Not assessed') out.miss.push('Life expectancy');
  const short = le === 'Under 10 years';
  if (r.rg === 'Low') {
    rows.push(R(short ? 'Life expectancy under 10 years: watchful waiting.' : 'Life expectancy over 10 years: active surveillance.', 'Strong - PCa §6.3.1.d'));
    rows.push(R('Whole-gland or focal therapy would be overtreatment outside a trial; do not use ADT monotherapy in asymptomatic localised disease.', 'PCa §6.3.1.c'));
  } else if (r.rg === 'High' && !r.la) {
    if (short) rows.push(R('Asymptomatic with life expectancy under 10 years: watchful waiting.', 'Strong - PCa §6.3.3.c'));
    rows.push(R('Radical prostatectomy in selected patients; if lymph node dissection is done, perform extended PLND. No frozen section of nodes to decide whether to abandon RP.', 'Strong - PCa §6.3.3.c'));
    rows.push(R('Radiotherapy: IMRT/VMAT + IGRT 76-78 Gy (or 60 Gy/20 fx, 70 Gy/28 fx) with long-term ADT for 2-3 years; focal boost to the MRI-defined dominant lesion (strong); brachytherapy boost in good urinary function (weak).', 'Strong - PCa §6.3.3.c'));
    rows.push(R('Do not offer whole-gland or focal therapy. ADT monotherapy only if unwilling/unable to have local treatment and PSA doubling time <12 months with PSA >50 or poorly differentiated tumour.', 'Strong - PCa §6.3.3.c'));
  } else if (r.rg === 'High' && r.la) {
    rows.push(R('Locally advanced / cN1: best outcomes come from local treatment combined with systemic treatment if the patient is fit for both (radiotherapy with long-term ADT is the established backbone; review the cN1M0 section for current options).', 'PCa §6.3.4'));
    rows.push(R('If suspicious nodes are found during RP in a cN0 patient, do not abandon the procedure and do not use frozen section.', 'PCa §6.3.4.a'));
  } else {
    if (short) rows.push(R('Asymptomatic with life expectancy under 10 years: watchful waiting.', 'Strong - PCa §6.3.2.f'));
    if (a.gg === '2') rows.push(R(a.asfav === 'Yes' ? 'ISUP GG2 with low disease extent: active surveillance can be offered to selected patients, accepting a possible increased risk of metastatic progression.' : a.asfav === 'No' ? 'ISUP GG2 without low disease extent: active surveillance not suitable on these criteria.' : 'ISUP GG2: active surveillance only for selected patients with low disease extent (answer the AS question).', 'Weak - PCa §6.3.2.f'));
    if (a.gg === '3') rows.push(R('ISUP GG3 must be excluded from active surveillance protocols.', 'Strong - PCa §6.3.2.f'));
    rows.push(R('Radical prostatectomy if life expectancy over 10 years; nerve-sparing when extracapsular risk on that side is low.', 'Strong - PCa §6.3.2.f'));
    rows.push(R('Radiotherapy: IMRT/VMAT + IGRT 76-78 Gy (or 60 Gy/20 fx, 70 Gy/28 fx) with short-term ADT for 4-6 months; weak options: focal boost, SBRT 36.25 Gy/5 fx or 42.7 Gy/7 fx (favourable intermediate).', 'Strong / Weak - PCa §6.3.2.f'));
    rows.push(R(r.rg === 'Favourable intermediate' ? 'LDR brachytherapy for good urinary function and NCCN-favourable intermediate-risk disease.' : 'LDR or HDR brachytherapy boost with IMRT/VMAT + short-term ADT in good urinary function (unfavourable intermediate).', (r.rg === 'Favourable intermediate' ? 'Strong' : 'Weak') + ' - PCa §6.3.2.f'));
    rows.push(R('Whole-gland or focal ablation only within trials/registries; no ADT monotherapy for asymptomatic men unable to have local treatment.', 'PCa §6.3.2.f'));
  }
  out.secs.push(S('Management (all recommendations assume conventional imaging)', rows));
  return out;
}

const GUIDE = {
  bladder: { name: 'Bladder cancer', fn: bladderAssess, src: 'NMIBC · MIBC/metastatic', dx: 'Ca Bladder' },
  prostate: { name: 'Prostate cancer', fn: prostateAssess, src: 'Prostate cancer', dx: 'Prostate CA' }
};
const guideKinds = p => Object.keys(GUIDE).filter(k => (p.dx || []).some(d => d.name === GUIDE[k].dx));
function guideSummary(p, k) {
  const c = p.clin && p.clin[k]; if (!c) return { risk: '', inputs: '' };
  return { risk: c.badge || '', inputs: Object.entries(c.a || {}).filter(([, v]) => v !== '' && v != null).map(([x, v]) => x + ': ' + v).join('; ') };
}


/* ---------------- optional AI review (opt-in, de-identified, user's own API key) ---------------- */
function aiPayload(p, kind, a, r) {
  const band = Math.floor((Number(p.age) || 0) / 10) * 10;
  const lines = ['Specialty: urology (' + GUIDE[kind].name + ')', 'Patient: ' + (band ? band + 's' : 'age n/a') + ', ' + (p.sex || 'sex n/a'), '', 'Entered clinical data:'];
  Object.entries(a).forEach(([k, v]) => { const f = GF[kind].find(x => x.id === k); lines.push('- ' + (f ? f.l : k) + ': ' + v); });
  lines.push('', 'Rule-based EAU 2026 assessment: ' + (r.badge || 'not assignable yet'));
  r.secs.forEach(s => { lines.push(s.h + ':'); s.rows.forEach(x => lines.push('  - ' + x.t)); });
  if (r.miss.length) lines.push('Missing data: ' + [...new Set(r.miss)].join(', '));
  return lines.join('\n');
}
async function aiFetch(url, opt) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 45000);
  try { return await fetch(url, Object.assign({ signal: ac.signal }, opt)); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'Timed out after 45 sec - model may be slow or overloaded. Try again or change the model in Settings.' : 'Network error: ' + e.message); }
  finally { clearTimeout(t); }
}
async function aiReview(text, key, model, prov) {
  const sys = 'You are a urology decision-support assistant for a resident doctor. You get de-identified clinical inputs and a rule-based EAU 2026 summary. Reply in concise English with three short headed lists: (1) Possible inconsistencies or data-entry doubts, (2) Missing information that could change management, (3) Questions to ask or investigations to consider. Base advice only on established EAU guideline principles, do not invent recommendations or numbers, say when unsure. The final decision rests with the treating doctor.';
  if (prov === 'gemini') {
    const m = (!model || model === 'gemini-2.5-flash') ? 'gemini-3.8-flash' : model;
    const r = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(m) + ':generateContent', { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text }] }], generationConfig: { maxOutputTokens: 3000 } }) });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    const c = j.candidates && j.candidates[0];
    return ((c && c.content && c.content.parts) || []).map(x => x.text || '').join('\n').trim() || 'No text returned (model may have used its whole token budget thinking). Try again.';
  }
  const r = await aiFetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: model || 'claude-sonnet-5-5', max_tokens: 900, system: sys, messages: [{ role: 'user', content: text }] }) });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return (j.content || []).map(c => c.text || '').join('\n').trim();
}

Views.guide = async ({ pid, kind }) => {
  const p = await Repo.patient(pid); const G = GUIDE[kind];
  let a = Object.assign({}, p.clin && p.clin[kind] ? p.clin[kind].a : {});
  const visible = () => GF[kind].filter(f => !f.show || f.show(a));
  const form = () => visible().map(f => {
    if (f.t === 'n') return '<label class="lbl">' + esc(f.l) + '</label><input class="inp" inputmode="decimal" data-n="' + f.id + '" value="' + esc(a[f.id] == null ? '' : a[f.id]) + '">';
    const opts = typeof f.o === 'function' ? f.o(a) : f.o;
    return '<label class="lbl">' + esc(f.l) + '</label><div class="chips wrapchips">' + opts.map(o => '<button type="button" data-act="gp" class="chip sm ' + (a[f.id] === o ? 'on' : '') + '" data-f="' + f.id + '" data-v="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  }).join('');
  const clean = () => { const keep = new Set(visible().map(f => f.id)); Object.keys(a).forEach(k => { if (!keep.has(k)) delete a[k]; }); };
  const result = () => {
    const r = G.fn(a, p);
    return (r.badge ? '<div class="card" style="background:var(--navy);color:#fff;border:0"><div class="small" style="color:#9FB4C8">Assessment</div><div style="font-size:19px;font-weight:700;margin-top:2px">' + esc(r.badge) + '</div>' + (r.note ? '<div class="small" style="color:#C9D6E2;margin-top:6px">' + esc(r.note) + '</div>' : '') + '</div>' : '') +
      (r.miss.length ? '<div class="card" style="background:var(--ambert);border-color:#FCD34D"><b>Still needed</b><div class="small" style="color:var(--amberd);margin-top:4px">' + esc([...new Set(r.miss)].join(' · ')) + '</div></div>' : '') +
      r.secs.map(s => '<div class="sec" style="margin:16px 0 8px"><h2>' + esc(s.h) + '</h2></div><div class="card" style="padding:4px 14px">' + s.rows.map(x => '<div class="irow" style="display:block"><div style="font-size:14.5px">' + esc(x.t) + '</div><div class="small" style="margin-top:4px;color:var(--link);font-weight:600">' + esc(x.tag) + '</div></div>').join('') + '</div>').join('') ;
  };
  const save = debounce(async () => { const r = G.fn(a, p); await Repo.setClin(pid, kind, a, r.badge || ''); }, 600);
  return {
    html: hdr('EAU Guidance') + wrapPage(
      '<div class="phead" style="margin-bottom:4px"><div class="avatar">' + esc(initials(p.name)) + '</div><div><div class="t-name">' + esc(p.name) + '</div><div class="t-sub"><b>' + esc(p.uhid) + '</b> &middot; ' + p.age + 'y &middot; ' + G.name + '</div></div></div>' +
      '<div class="banner" style="margin-top:12px">' + ic('shield', 16) + ' On-device only. Nothing is sent anywhere.</div>' +
      '<div id="gq">' + form() + '</div><div style="height:6px"></div><div id="ga">' + result() + '</div>' +
      '<div class="sec" style="margin:16px 0 8px"><h2>AI review (optional)</h2></div><div class="card"><div class="small" style="margin-bottom:10px">Sends only the answers above (no name, UHID, mobile or exact age) to the AI provider you set, using your own API key, after you preview and approve it.</div><button class="btn o" data-act="aiGo">' + ic('book', 18) + ' Review with AI</button><div id="aiout"></div></div>' +
      '<div class="small" style="margin-top:18px;line-height:1.5">' + esc(EAU_VER) + '. Recommendations are paraphrased from the guidelines for decision support. They do not replace clinical judgement or the full guideline text - verify before acting. Answers are saved to this patient automatically.</div>'),
    acts: {
      aiGo: async () => {
        const key = await metaGet('aiKey');
        if (!key) return alertDlg('AI not set up', 'Add your API key in Settings > AI assistant first.');
        const model = await metaGet('aiModel'); const prov = (await metaGet('aiProv')) || 'gemini'; const host = prov === 'gemini' ? 'generativelanguage.googleapis.com (Google)' : 'api.anthropic.com (Anthropic)'; const text = aiPayload(p, kind, a, G.fn(a, p));
        sheet('<h3>Review before sending</h3><div class="small" style="margin-bottom:8px">This exact text will be sent to ' + host + '. Nothing else is sent.</div><div class="card pre" style="max-height:38vh;overflow:auto;font-size:13px">' + esc(text) + '</div><div style="height:12px"></div><button class="btn" id="aiok">Send</button><button class="btn o" style="margin-top:8px" id="aino">Cancel</button>', (sh, close) => {
          $('#aino', sh).onclick = close;
          $('#aiok', sh).onclick = async () => {
            close();
            try { const out = await withBusy('Asking AI...', () => aiReview(text, key, model, prov)); $('#aiout').innerHTML = '<div class="pre" style="margin-top:12px;font-size:14.5px">' + esc(out) + '</div><div class="small" style="margin-top:8px">AI-generated. Verify against the guideline.</div>'; await Repo.audit('ai_review', 'guidance', null, pid); }
            catch (e) { alertDlg('AI request failed', String(e.message || e)); }
          };
        });
      },
      gp: el => {
        const id = el.dataset.f, v = el.dataset.v;
        if (a[id] === v) delete a[id]; else a[id] = v;
        if (id === 'sys') delete a.grade;
        clean(); $('#gq').innerHTML = form(); $('#ga').innerHTML = result(); save();
      }
    },
    bind: root => {
      root.oninput = e => { const n = e.target.dataset && e.target.dataset.n; if (!n || !$('#ga')) return; const cl = e.target.value.replace(/[^0-9.]/g, ''); if (cl !== e.target.value) e.target.value = cl; if (cl === '') delete a[n]; else a[n] = cl; $('#ga').innerHTML = result(); save(); };
    }
  };
};
ACT.openGuide = el => go('guide', { pid: +el.dataset.pid, kind: el.dataset.k });

/* AI connection test + model list (Settings) */
async function aiTest(prov, key, model) {
  const t0 = Date.now();
  if (prov === 'gemini') {
    const r = await aiFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100', { headers: { 'x-goog-api-key': key } });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
    const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', '')).filter(n => /^gemini/.test(n));
    return { ms: Date.now() - t0, models: names };
  }
  const out = await aiReview('Reply with the single word OK.', key, model, prov);
  return { ms: Date.now() - t0, models: [], note: out.slice(0, 40) };
}
