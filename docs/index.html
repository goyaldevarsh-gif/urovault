<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/Inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/Inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/Inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/Inter-700.woff2) format("woff2")}
:root{
  --navy:#0F2942;--navy2:#0B4A55;--teal:#0D9488;--btn:#0B8378;--link:#0F766E;--lt:#E6F7F5;
  --bg:#F8FAFC;--t2:#64748B;--red:#EF4444;--redd:#B91C1C;--green:#10B981;--greend:#047857;--amber:#F59E0B;--amberd:#B45309;
  --bd:#E2E8F0;--redt:#FEE2E2;--greent:#D1FAE5;--ambert:#FEF3C7;--grey:#F1F5F9;
  --r:16px;--sh:0 3px 12px rgba(15,41,66,.06);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--navy);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--navy)}
.ic{display:inline-block;vertical-align:middle;flex:none}
#app{min-height:100vh;min-height:100dvh}
.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:var(--sat)}
.hdr .in{max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px}
.hdr h1{flex:1;margin:0;text-align:center;font-size:17px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px}
.hdr .ib:active{background:rgba(255,255,255,.14)}
.hdr .sp{width:44px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.page{padding-top:14px;padding-bottom:calc(96px + var(--sab))}
.page.nobar{padding-bottom:calc(28px + var(--sab))}
.dhead{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:0 0 28px 28px;padding-top:var(--sat)}
.dhead .in{max-width:640px;margin:0 auto;padding:6px 16px 22px}
.dhead .top{display:flex;align-items:center;gap:8px;height:48px}
.dhead .brand{font-size:18px;font-weight:700;flex:1}
.dhead .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative}
.dhead .ib:active{background:rgba(255,255,255,.14)}
.dot{position:absolute;top:9px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.greet{font-size:26px;font-weight:700;line-height:1.2;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;color:var(--navy);border-radius:16px;padding:14px 6px 12px;text-align:center;border:0;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.stat .n{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.stat .l{font-size:12px;color:var(--t2);font-weight:500}
.stat .ic{color:var(--teal)}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:10px}
.card.tap{cursor:pointer}.card.tap:active{background:#F1F5F9}
.card.sel{background:var(--lt);border-color:var(--teal)}
.tile{display:flex;align-items:center;gap:12px;padding:12px 14px}
.tile .grow{flex:1;min-width:0}
.t-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub b{color:var(--navy);font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lt);color:var(--link);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.lg{width:54px;height:54px;font-size:18px}
.iconbox{width:42px;height:42px;border-radius:12px;background:var(--lt);color:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.sec{display:flex;align-items:center;margin:22px 0 10px}
.sec h2{flex:1;margin:0;font-size:15px;font-weight:700}
.sec a,.sec button{background:none;border:0;color:var(--link);font-weight:600;font-size:13px;padding:6px 0}
.small{font-size:12.5px;color:var(--t2)}
.muted{color:var(--t2)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--t2);text-transform:uppercase;margin:16px 0 6px}
.lbl i{color:var(--red);font-style:normal}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--lt);color:var(--link);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.red{background:var(--redt);color:var(--redd)}.pill.green{background:var(--greent);color:var(--greend)}.pill.amber{background:var(--ambert);color:var(--amberd)}.pill.grey{background:var(--grey);color:var(--navy)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapchips{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1.5px solid var(--bd);background:#fff;color:var(--navy);padding:8px 14px;border-radius:20px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip .c{opacity:.75;margin-left:6px;font-weight:600}
.chip.sm{padding:6px 11px;font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-size:16px;font-weight:600}
.btn:active{filter:brightness(.92)}.btn[disabled]{opacity:.55}
.btn.o{background:#fff;color:var(--link);border:1.5px solid var(--btn);height:46px;font-size:14px}
.btn.red{background:var(--red)}
.btn.sm{height:40px;font-size:13.5px;border-radius:12px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--bd);padding:10px 16px calc(10px + var(--sab))}
.bar .in{max-width:608px;margin:0 auto}
.linkbtn{background:none;border:0;color:var(--link);font-weight:600;font-size:13px;padding:4px 0}
.inp,.ta,.sel{width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.ta{min-height:104px;resize:vertical;line-height:1.45}
.inp.err,.ta.err{border-color:var(--red)}
.inp.uhid{font-size:22px;font-weight:700;letter-spacing:.8px;background:var(--lt);border:2px solid var(--teal);padding:16px;border-radius:14px;text-transform:uppercase}
.inp.uhid.err{border-color:var(--red);background:var(--redt)}
.ferr{color:var(--redd);font-size:12.5px;margin-top:5px;font-weight:500}
.dup{margin-top:8px;padding:11px 12px;background:var(--redt);color:var(--redd);border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.dup button{margin-left:auto;background:none;border:0;color:var(--redd);font-weight:700}
.seg{display:flex;gap:6px}.seg button{flex:1;height:50px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;font-size:14px;font-weight:600;color:var(--navy)}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.seg.err button{border-color:var(--red)}
.two{display:grid;grid-template-columns:2fr 5fr;gap:14px}
.banner{display:flex;align-items:center;gap:8px;background:var(--lt);padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:6px}
.banner button{margin-left:auto;background:none;border:0;color:var(--link);font-weight:600}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid #CBD5E1;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.chk.r{border-radius:50%}.chk.on{background:var(--btn);border-color:var(--btn)}
.irow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}
.irow:last-child{border-bottom:0}
.irow .ic{color:var(--teal);margin-top:2px}
.irow .k{font-size:12px;color:var(--t2)}.irow .v{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);scrollbar-width:none;position:sticky;top:calc(52px + var(--sat));z-index:12}
.tabs::-webkit-scrollbar{display:none}
.tabs .in{display:flex;max-width:640px;margin:0 auto;width:100%;padding:0 6px}
.tab{flex:1;flex-shrink:0;border:0;background:none;padding:13px 8px;font-size:13.5px;font-weight:500;color:var(--t2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--link);font-weight:700;border-color:var(--teal)}
.phead{display:flex;gap:12px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mi{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--grey);border:0;padding:0}
.mi img{width:100%;height:100%;object-fit:cover;display:block}
.mi .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:10.5px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.file{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lt);color:var(--teal);gap:4px;font-size:11px;padding:6px;text-align:center}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--grey);border:0;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.file{display:flex;align-items:center;justify-content:center;background:var(--lt);color:var(--teal)}
.th .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.th .x.red{background:var(--red)}
.viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.viewer .vt{display:flex;align-items:center;padding:calc(6px + var(--sat)) 8px 6px;color:#fff;background:#000}
.viewer .vt .ib{width:44px;height:44px;border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center}
.viewer .vt .cnt{flex:1;text-align:center;font-size:14px;font-weight:600}
.viewer .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.viewer .stage img{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.viewer .vb{padding:12px 18px calc(12px + var(--sab));background:#0B1B2D;color:#fff;font-size:14px}
.viewer .nav{position:absolute;top:50%;width:44px;height:64px;margin-top:-32px;border:0;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center}
.tl{position:relative;padding-left:30px}
.tl:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--bd)}
.tl .ev{position:relative;margin-bottom:10px}
.tl .ev:before{content:"";position:absolute;left:-25px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid var(--teal)}
.tl .ev.hollow:before{background:#fff}
.tl .ev.red:before{background:var(--red);border-color:var(--red)}.tl .ev.green:before{background:var(--green);border-color:var(--green)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);padding-bottom:var(--sab)}
.nav .in{max-width:640px;margin:0 auto;height:62px;display:flex;align-items:center}
.nav button{flex:1;height:62px;border:0;background:none;color:var(--t2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500}
.nav button.on{color:var(--link);font-weight:700}
.nav .plus{flex:1;display:flex;justify-content:center}
.nav .plus button{flex:none;width:52px;height:52px;border-radius:50%;background:var(--btn);color:#fff;box-shadow:0 5px 14px rgba(13,148,136,.4);margin-top:-6px}
.empty{text-align:center;padding:40px 24px}
.empty .ring{width:76px;height:76px;border-radius:50%;background:var(--lt);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty h3{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--t2);font-size:13.5px}
.empty .btn{width:auto;display:inline-flex;padding:0 26px}
.mrow{display:flex;align-items:center;gap:14px;cursor:pointer}
.mrow .grow{flex:1}
.mrow .t{font-weight:600}.mrow .s{font-size:12.5px;color:var(--t2)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--navy)}
.qa button:active{background:#F1F5F9}
.qa .iconbox{width:46px;height:46px;border-radius:14px}
.dxcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.dxcard .nm{flex:1;font-weight:600;font-size:15px}
.dxcard .iconbox{background:#fff;border:1px solid var(--bd)}
.card.sel .iconbox{border-color:var(--teal)}
.sub{margin-top:12px;padding-top:12px;border-top:1px dashed #99D5CF}
.bars .br{display:flex;align-items:center;gap:10px;padding:6px 0}
.bars .nm{width:112px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .tr{flex:1;height:10px;border-radius:6px;background:var(--lt);overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bars b{width:28px;text-align:right}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,41,66,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:8px 20px calc(18px + var(--sab));max-height:88vh;overflow:auto;animation:up .2s}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#CBD5E1;margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px}
.modal{background:#fff;border-radius:18px;max-width:340px;width:calc(100% - 40px);padding:20px;align-self:center;animation:pop .15s}
.modal h3{margin:0 0 8px;font-size:17px}.modal p{margin:0 0 18px;color:#334155;font-size:14.5px}
.modal .row .btn{height:44px;font-size:15px}
.scrim.mid{align-items:center}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}
.busy{position:fixed;inset:0;z-index:95;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:600}
.spin{width:34px;height:34px;border:4px solid var(--lt);border-top-color:var(--teal);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.splash{position:fixed;inset:0;background:linear-gradient(180deg,var(--navy),#0B3B4F);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;overflow:hidden}
.splash .lg{animation:pop .9s cubic-bezier(.2,.9,.3,1.2)}
.splash h1{font-size:38px;margin:16px 0 6px;font-weight:700;animation:fade 1.2s}
.splash p{margin:0;opacity:.8;font-size:14px;animation:fade 1.6s}
.splash svg.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
.auth{min-height:100vh;min-height:100dvh;background:#fff;padding:calc(30px + var(--sat)) 24px calc(30px + var(--sab))}
.auth .in{max-width:420px;margin:0 auto}
.auth .logo{text-align:center}
.auth h1{text-align:center;margin:0;font-size:28px}
.auth .sub2{text-align:center;color:var(--t2);margin:6px 0 26px}
.pwrap{position:relative}.pwrap button{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;background:none;color:var(--t2)}
.feat{display:flex;gap:14px;align-items:center;padding:12px 14px}
.feat .t{font-weight:600}.feat .s{font-size:12.5px;color:var(--t2)}
.ios{margin-top:22px;padding:12px;background:var(--lt);border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
@media print{
  .hdr,.bar,.nav,.toast,.noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}.page{padding:0}
}
input[type=date].inp{min-height:50px;display:block;text-align:left;-webkit-min-logical-width:calc(100% - 2px)}
.fab-row{display:flex;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--t2)}.kv span:last-child{font-weight:600;text-align:right}
.sw{width:50px;height:30px;border-radius:15px;background:#CBD5E1;border:0;position:relative;flex:none;transition:.15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--btn)}.sw.on:after{left:23px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.big-date{font-size:20px;font-weight:700}
.sticky-search{position:sticky;top:calc(52px + var(--sat));z-index:11;background:var(--bg);padding:10px 0 4px}
.sch{position:relative}.sch .ic{position:absolute;left:14px;top:50%;margin-top:-10px;color:var(--t2)}.sch .inp{padding-left:42px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + var(--sab));z-index:40;max-width:616px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(15,41,66,.35)}
.updbar span{flex:1}.updbar button{border:0;background:var(--teal);color:#fff;font-weight:700;border-radius:10px;height:38px;padding:0 16px;font-size:14px}
.qa.q4{grid-template-columns:repeat(4,1fr);gap:8px}.qa.q4 button{padding:14px 2px 10px;font-size:11.5px}.qa.q4 .iconbox{width:40px;height:40px;border-radius:12px}
.dhead .brand{display:flex;align-items:center;gap:10px;min-width:0}.dhead .brand .bn{font-size:19px;font-weight:700;line-height:1.1}.dhead .brand .bt{font-size:10.5px;opacity:.8;font-weight:500;letter-spacing:.2px;white-space:nowrap}

</style>

const Repo = {
  async audit(action, entity, entityId, patientId) {
    try { await dbPut('audit', { ts: new Date().toISOString(), action, entity, entityId: entityId || null, patientId: patientId || null }); } catch (e) { /* never block a save on logging */ }
  },
  /* ---- patients ---- */
  patients: () => dbAll('patients'),
  patient: id => dbGet('patients', id),
  async uhidTaken(uhid, exceptId) {
    const k = uhidKey(uhid);
    if (!k) return null;
    const p = await rq(store('patients').index('uhidKey').get(k));
    return p && p.id !== exceptId ? p : null;
  },
  async savePatient(p) {
    const now = new Date().toISOString();
    const rec = Object.assign({}, p, { uhid: p.uhid.trim(), uhidKey: uhidKey(p.uhid), name: p.name.trim(), updatedAt: now });
    if (!rec.id) { rec.createdAt = now; rec.dx = rec.dx || []; delete rec.id; }
    const id = await dbPut('patients', rec);
    await Repo.audit(p.id ? 'update' : 'create', 'patient', id, id);
    return id;
  },
  async touch(pid) { const p = await dbGet('patients', pid); if (p) { p.updatedAt = new Date().toISOString(); await dbPut('patients', p); } },
  async setDx(pid, dx, addDx) {
    const p = await dbGet('patients', pid);
    p.dx = dx; p.addDx = nn(addDx); p.updatedAt = new Date().toISOString();
    await dbPut('patients', p);
    await Repo.audit('update', 'diagnosis', null, pid);
  },
  async deletePatient(id) {
    for (const n of ['investigations', 'surgeries', 'followups', 'notes']) for (const r of await dbBy(n, id)) await dbDel(n, r.id);
    for (const m of await dbBy('media', id)) { freeUrl(m.id); await dbDel('blobs', m.id); await dbDel('media', m.id); }
    await dbDel('patients', id);
    await Repo.audit('delete', 'patient', id);
  },
  /* ---- investigations ---- */
  async invs(pid) { return (await dbBy('investigations', pid)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id); },
  async addInv(pid, name, date, notes) {
    const id = await dbPut('investigations', { patientId: pid, name, date, notes: nn(notes), createdAt: new Date().toISOString() });
    await Repo.touch(pid); await Repo.audit('create', 'investigation', id, pid); return id;
  },
  async updInv(id, date, notes) {
    const r = await dbGet('investigations', id); r.date = date; r.notes = nn(notes);
    await dbPut('investigations', r); await Repo.audit('update', 'investigation', id, r.patientId);
  },
  async delInv(id) { await Repo.delRefMedia('investigation', id); await dbDel('investigations', id); await Repo.audit('delete', 'investigation', id); },
  /* ---- media ---- */
  async media(pid) { return (await dbBy('media', pid)).sort((a, b) => b.takenAt.localeCompare(a.takenAt) || b.id - a.id); },
  async addMedia(o) {
    const f = o.file;
    let blob = f, thumb = null, kind = 'file';
    if (isImg(f)) { const r = await processImage(f); blob = r.blob; thumb = r.thumb; kind = 'image'; }
    const id = await dbPut('media', {
      patientId: o.pid, kind, category: o.category || 'Other', caption: nn(o.caption), takenAt: o.takenAt || iso(today()),
      refType: o.refType || null, refId: o.refId || null, name: f.name || 'file', mime: blob.type || f.type || '', thumb, createdAt: new Date().toISOString()
    });
    await dbPut('blobs', { id, blob });
    await Repo.touch(o.pid); await Repo.audit('create', 'media', id, o.pid);
    return id;
  },
  async updMedia(id, category, caption) { const m = await dbGet('media', id); m.category = category; m.caption = nn(caption); await dbPut('media', m); await Repo.audit('update', 'media', id, m.patientId); },
  async delMedia(m) { freeUrl(m.id); await dbDel('blobs', m.id); await dbDel('media', m.id); await Repo.audit('delete', 'media', m.id, m.patientId); },
  async delRefMedia(refType, refId) {
    for (const m of await dbAll('media')) if (m.refType === refType && m.refId === refId) { freeUrl(m.id); await dbDel('blobs', m.id); await dbDel('media', m.id); }
  },
  /* ---- surgeries ---- */
  async surgeries(pid) { return (await dbBy('surgeries', pid)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id); },
  async allSurgeries() {
    const ps = new Map((await dbAll('patients')).map(p => [p.id, p]));
    return (await dbAll('surgeries')).filter(s => ps.has(s.patientId)).map(s => Object.assign({}, s, { pname: ps.get(s.patientId).name, uhid: ps.get(s.patientId).uhid })).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  },
  async saveSurgery(s) {
    const rec = Object.assign({}, s);
    ['indication', 'notes', 'findings', 'hpe', 'postop', 'assist1', 'assist2', 'assist3'].forEach(k => { rec[k] = nn(rec[k]); });
    rec.duration = rec.duration ? Math.max(0, Math.round(Number(rec.duration))) || null : null;
    rec.procedure = rec.procedure.trim();
    if (!rec.id) { rec.createdAt = new Date().toISOString(); delete rec.id; }
    const id = await dbPut('surgeries', rec);
    await Repo.touch(rec.patientId); await Repo.audit(s.id ? 'update' : 'create', 'surgery', id, rec.patientId);
    return id;
  },
  async delSurgery(id) { await Repo.delRefMedia('surgery', id); await dbDel('surgeries', id); await Repo.audit('delete', 'surgery', id); },
  /* ---- follow-ups ---- */
  async fus(pid) { return (await dbBy('followups', pid)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id); },
  async allFus() {
    const ps = new Map((await dbAll('patients')).map(p => [p.id, p]));
    return (await dbAll('followups')).filter(f => ps.has(f.patientId)).map(f => { const p = ps.get(f.patientId); return Object.assign({}, f, { pname: p.name, uhid: p.uhid, dx: p.dx && p.dx[0] ? p.dx[0].name : null }); });
  },
  fuClass(f) {
    if (f.completed) return 'Completed';
    const d = dayDiff(f.date);
    return d === 0 ? 'Due Today' : d > 0 ? 'Upcoming' : 'Overdue';
  },
  async fuList(filter) {
    const all = (await Repo.allFus()).filter(f => Repo.fuClass(f) === filter);
    return all.sort((a, b) => filter === 'Completed' ? b.date.localeCompare(a.date) || b.id - a.id : a.date.localeCompare(b.date));
  },
  async fuCounts() { const c = { 'Due Today': 0, 'Upcoming': 0, 'Overdue': 0, 'Completed': 0 }; (await Repo.allFus()).forEach(f => { c[Repo.fuClass(f)]++; }); return c; },
  async pending(limit) { const l = (await Repo.allFus()).filter(f => !f.completed).sort((a, b) => a.date.localeCompare(b.date)); return limit ? l.slice(0, limit) : l; },
  /** Records a visit. One active "next follow-up" per patient: a new visit replaces any pending one. */
  async saveVisit(o) {
    let editingCompleted = false, id = o.existingId;
    if (id) { const ex = await dbGet('followups', id); editingCompleted = !!(ex && ex.completed); }
    const base = { patientId: o.pid, date: o.date, notes: nn(o.notes), status: o.status || null, completed: true, nextDate: o.nextDate || null };
    if (id) { const ex = await dbGet('followups', id); id = await dbPut('followups', Object.assign({}, ex, base)); }
    else id = await dbPut('followups', Object.assign({ createdAt: new Date().toISOString() }, base));
    if (!editingCompleted) {
      for (const f of await dbBy('followups', o.pid)) if (!f.completed && f.id !== id) await dbDel('followups', f.id);
      if (o.nextDate) await dbPut('followups', { patientId: o.pid, date: o.nextDate, notes: null, status: null, completed: false, nextDate: null, createdAt: new Date().toISOString() });
    }
    await Repo.touch(o.pid); await Repo.audit(o.existingId ? 'update' : 'create', 'followup', id, o.pid);
    return id;
  },
  async schedule(pid, date) {
    for (const f of await dbBy('followups', pid)) if (!f.completed) await dbDel('followups', f.id);
    const id = await dbPut('followups', { patientId: pid, date, notes: null, status: null, completed: false, nextDate: null, createdAt: new Date().toISOString() });
    await Repo.audit('create', 'followup', id, pid);
  },
  async delFu(id) { await Repo.delRefMedia('followup', id); await dbDel('followups', id); await Repo.audit('delete', 'followup', id); },
  /* ---- notes ---- */
  async notes(pid) { return (await dbBy('notes', pid)).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async addNote(pid, text) { const id = await dbPut('notes', { patientId: pid, note: text.trim(), createdAt: new Date().toISOString() }); await Repo.touch(pid); await Repo.audit('create', 'note', id, pid); },
  async delNote(id) { await dbDel('notes', id); await Repo.audit('delete', 'note', id); },
  /* ---- timeline ---- */
  async timeline(pid) {
    const p = await dbGet('patients', pid); if (!p) return [];
    const ev = [{ date: (p.createdAt || iso(today())).slice(0, 10), title: 'Initial visit', sub: p.cc || '', type: 'visit', tab: 'overview' }];
    (await Repo.invs(pid)).forEach(i => ev.push({ date: i.date, title: i.name, sub: i.notes || 'Investigation', type: 'inv', tab: 'inv' }));
    (await Repo.surgeries(pid)).forEach(s => ev.push({ date: s.date, title: 'Surgery - ' + s.procedure, sub: s.indication || '', type: 'surgery', tab: 'surgery' }));
    (await Repo.fus(pid)).forEach(f => ev.push(f.completed ? { date: f.date, title: 'Follow-up', sub: f.notes || f.status || '', type: 'fu', tab: 'fu' } : { date: f.date, title: 'Follow-up scheduled', sub: relDays(f.date), type: 'sched', tab: 'fu' }));
    return ev.sort((a, b) => a.date.localeCompare(b.date));
  },
  /* ---- stats ---- */
  async counts() {
    const [p, s, i, m, f] = await Promise.all([dbAll('patients'), dbAll('surgeries'), dbAll('investigations'), dbAll('media'), dbAll('followups')]);
    const t = iso(today());
    return { patients: p.length, surgeries: s.length, investigations: i.length, media: m.length, seen: f.filter(x => x.completed).length, due: f.filter(x => !x.completed && x.date <= t).length };
  },
  async dxStats() {
    const m = {};
    (await dbAll('patients')).forEach(p => (p.dx || []).forEach(d => { m[d.name] = (m[d.name] || 0) + 1; }));
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  },
  async auditLog() { return (await dbAll('audit')).sort((a, b) => b.id - a.id).slice(0, 200); },
  /* ---- demo ---- */
  async hasDemo() { return (await dbAll('patients')).some(p => p.isDemo); },
  async loadDemo() {
    if (await Repo.hasDemo()) return;
    const d = n => iso(new Date(today().getFullYear(), today().getMonth(), today().getDate() + n));
    const mk = async (uhid, name, age, sex, cc, dx) => Repo.savePatient({ uhid, name, age, sex, cc, mobile: null, addDx: null, isDemo: true, dx });
    const a = await mk('DEMO/2026/001', 'Demo Patient A', 58, 'Male', 'Hematuria for 2 weeks', [{ name: 'Ca Bladder' }]);
    await Repo.addInv(a, 'RFT', d(-20)); await Repo.addInv(a, 'CBC', d(-20)); await Repo.addInv(a, 'CT', d(-19), 'Sample entry');
    await Repo.saveSurgery({ patientId: a, procedure: 'TURBT', date: d(-14), duration: 55, assist1: 'Dr. Sample A', assist2: 'Dr. Sample B', indication: 'Ca bladder - diagnostic and therapeutic', notes: 'Sample operative note.', hpe: 'Sample HPE entry' });
    await Repo.saveVisit({ pid: a, date: d(-3), notes: 'Sample follow-up note.', status: 'Stable', nextDate: d(0) });
    const b = await mk('DEMO/2026/002', 'Demo Patient B', 46, 'Male', 'Right flank pain for 1 month', [{ name: 'Renal Stone', lat: 'Right' }]);
    await Repo.addInv(b, 'Urine Analysis', d(-5)); await Repo.schedule(b, d(6));
    const c = await mk('DEMO/2026/003', 'Demo Patient C', 62, 'Male', 'Poor stream, nocturia', [{ name: 'Prostate CA' }]);
    await Repo.addInv(c, 'PSA', d(-8)); await Repo.schedule(c, d(-4));
    const e = await mk('DEMO/2026/004', 'Demo Patient D', 34, 'Female', 'Left loin pain', [{ name: 'PUJO', lat: 'Left' }]);
    await Repo.addInv(e, 'DTPA', d(-2)); await Repo.schedule(e, d(21));
  },
  async clearDemo() { for (const p of await dbAll('patients')) if (p.isDemo) await Repo.deletePatient(p.id); },
  /* ---- backup (JSON, images as base64) ---- */
  async buildBackup(onProgress) {
    const parts = ['{"app":"UroVault","version":1,"exportedAt":' + JSON.stringify(new Date().toISOString()) + ','];
    for (const n of ['patients', 'investigations', 'surgeries', 'followups', 'notes', 'media', 'audit']) parts.push(JSON.stringify(n) + ':' + JSON.stringify(await dbAll(n)) + ',');
    parts.push('"blobs":[');
    const blobs = await dbAll('blobs');
    let first = true, k = 0;
    for (const b of blobs) {
      parts.push((first ? '' : ',') + JSON.stringify({ id: b.id, type: b.blob.type, data: await blobToB64(b.blob) }));
      first = false; k++;
      if (onProgress) onProgress(k, blobs.length);
    }
    parts.push(']}');
    return new Blob(parts, { type: 'application/json' });
  },
  async restoreBackup(text) {
    const j = JSON.parse(text);
    if (j.app !== 'UroVault' || !j.patients) throw new Error('This file is not a UroVault backup');
    for (const n of ['patients', 'investigations', 'surgeries', 'followups', 'notes', 'media', 'blobs', 'audit']) await dbClear(n);
    _urls.forEach(u => URL.revokeObjectURL(u)); _urls.clear();
    for (const n of ['patients', 'investigations', 'surgeries', 'followups', 'notes', 'media', 'audit']) for (const r of (j[n] || [])) await dbPut(n, r);
    for (const b of (j.blobs || [])) await dbPut('blobs', { id: b.id, blob: b64ToBlob(b.data, b.type) });
    await Repo.audit('restore', 'backup');
  },
  async eraseAll() { for (const n of STORES) await dbClear(n); _urls.clear(); }
};

/* ---------------- auth (local account, PBKDF2) ---------------- */
const enc = new TextEncoder();
const bytesToB64 = a => btoa(String.fromCharCode(...a));
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pbk(pw, salt) {
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, key, 256));
}
const Auth = {
  has: async () => !!(await metaGet('acct')),
  async create(name, id, pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    await metaSet('acct', { name: name.trim(), id: id.trim().toLowerCase(), salt: bytesToB64(salt), hash: bytesToB64(await pbk(pw, salt)) });
  },
  async verify(id, pw) {
    const a = await metaGet('acct'); if (!a || a.id !== id.trim().toLowerCase()) return false;
    return bytesToB64(await pbk(pw, b64ToBytes(a.salt))) === a.hash;
  },
  async setPassword(pw) { const a = await metaGet('acct'); const salt = crypto.getRandomValues(new Uint8Array(16)); a.salt = bytesToB64(salt); a.hash = bytesToB64(await pbk(pw, salt)); await metaSet('acct', a); },
  acct: () => metaGet('acct'),
  async setName(n) { const a = await metaGet('acct'); a.name = n.trim(); await metaSet('acct', a); }
};

/* ===================== UroVault PWA - ui infrastructure ===================== */
const app = $('#app');
const SESSION = { unlocked: false, hiddenAt: 0 };
const Views = {};
const ACT = {};
let STACK = [];
let CUR_TAB = 'home';
let _renderSeq = 0;

const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function hdr(title, o) {
  o = o || {};
  return '<header class="hdr"><div class="in">' +
    (o.back === false ? '<div class="sp"></div>' : '<button class="ib" data-act="back" aria-label="Back">' + ic('left', 22) + '</button>') +
    '<h1>' + esc(title) + '</h1>' + (o.right || '<div class="sp"></div>') + '</div></header>';
}
function navbar(active) {
  const b = (k, i, l) => '<button class="' + (active === k ? 'on' : '') + '" data-act="tab" data-v="' + k + '">' + ic(i, 22) + '<span>' + l + '</span></button>';
  return '<nav class="nav"><div class="in">' + b('home', 'home', 'Home') + b('patients', 'users', 'Patients') +
    '<div class="plus"><button data-act="newPatient" aria-label="New patient">' + ic('plus', 26) + '</button></div>' +
    b('followups', 'cal', 'Follow-ups') + b('more', 'more', 'More') + '</div></nav>';
}
const wrapPage = (html, bar) => '<div class="wrap page' + (bar ? '' : ' nobar') + '">' + html + '</div>';
const emptyBox = (icon, title, text, btn) => '<div class="empty"><div class="ring">' + ic(icon, 34) + '</div><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (btn || '') + '</div>';

async function render(keepScroll) {
  const seq = ++_renderSeq;
  const top = STACK[STACK.length - 1];
  if (!top) return;
  let r;
  try { r = await Views[top.view](top.params || {}); }
  catch (e) {
    console.error(e);
    r = { html: hdr('Error', { back: STACK.length > 1 }) + wrapPage('<div class="card"><b>Something went wrong.</b><div class="small" style="margin-top:6px">' + esc(e && e.message) + '</div></div>') };
  }
  if (seq !== _renderSeq) return;
  app.innerHTML = r.html;
  app.onclick = ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    const h = (r.acts && r.acts[el.dataset.act]) || ACT[el.dataset.act];
    if (h) h(el, ev);
  };
  if (r.bind) r.bind(app);
  window.scrollTo(0, keepScroll ? (top.scroll || 0) : 0);
}
function go(view, params) {
  const t = STACK[STACK.length - 1]; if (t) t.scroll = window.scrollY;
  STACK.push({ view, params });
  try { history.pushState({ d: STACK.length }, ''); } catch (e) { /* ignore */ }
  render();
}
function replace(view, params) { STACK[STACK.length - 1] = { view, params }; render(); }
function back() { if (STACK.length > 1) history.back(); }
function setTab(t) { CUR_TAB = t; STACK = [{ view: t }]; render(); }
window.addEventListener('popstate', () => { if (STACK.length > 1) { STACK.pop(); render(true); } });
ACT.back = () => back();
ACT.tab = el => setTab(el.dataset.v);
ACT.newPatient = () => go('addPatient', {});

/* ---------- overlays ---------- */
function sheet(html, bind) {
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
  s.addEventListener('click', e => { if (e.target === s) s.remove(); });
  document.body.appendChild(s);
  const close = () => s.remove();
  if (bind) bind(s.firstChild, close);
  return { el: s, close };
}
function confirmDlg(title, msg, okLabel, danger) {
  return new Promise(res => {
    const s = document.createElement('div');
    s.className = 'scrim mid';
    s.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><div class="row"><button class="btn o" data-r="0">Cancel</button><button class="btn ' + (danger ? 'red' : '') + '" data-r="1">' + esc(okLabel || 'OK') + '</button></div></div>';
    s.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b || e.target === s) { s.remove(); res(!!b && b.dataset.r === '1'); } });
    document.body.appendChild(s);
  });
}
function alertDlg(title, msg) {
  return new Promise(res => {
    const s = document.createElement('div');
    s.className = 'scrim mid';
    s.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><button class="btn" data-r="1" style="height:44px">OK</button></div>';
    s.addEventListener('click', e => { if (e.target.closest('[data-r]') || e.target === s) { s.remove(); res(); } });
    document.body.appendChild(s);
  });
}
let _toastT = null;
function toast(msg) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(_toastT); _toastT = setTimeout(() => t.remove(), 2600);
}
function busy(msg) {
  const b = document.createElement('div'); b.className = 'busy';
  b.innerHTML = '<div class="spin"></div><div class="msg">' + esc(msg || 'Working...') + '</div>';
  document.body.appendChild(b);
  return { set: m => { $('.msg', b).textContent = m; }, done: () => b.remove() };
}
async function withBusy(msg, fn) {
  const b = busy(msg);
  try { return await fn(b); } finally { b.done(); }
}

/* ---------- files ---------- */
function pickFiles(o) {
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.style.display = 'none';
    if (o.accept) i.accept = o.accept;
    if (o.multiple) i.multiple = true;
    if (o.capture) i.setAttribute('capture', o.capture);
    document.body.appendChild(i);
    i.onchange = () => { res([...i.files]); setTimeout(() => i.remove(), 1500); };
    i.click();
  });
}
function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 4000);
}
/** Must be called straight from a tap (fresh user gesture) so iOS allows the share sheet. */
async function shareOrSave(blob, name) {
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  downloadBlob(blob, name);
  return 'downloaded';
}

    if (rm) { const f = st.files.splice(+rm.dataset.rm, 1)[0]; if (f.url) URL.revokeObjectURL(f.url); draw(); return; }
    const b = e.target.closest('[data-pk]'); if (!b) return;
    const k = b.dataset.pk;

    fs.forEach(f => { const img = isImg(f); st.files.push({ file: f, img, url: img ? URL.createObjectURL(f) : '' }); });
    draw();
  });
  st.clear = () => { st.files.forEach(f => f.url && URL.revokeObjectURL(f.url)); st.files = []; draw(); };
  return st;
}
async function saveStaged(st, o) {

/* ---------- viewer (zoom / pan / swipe) ---------- */
function openViewer(list, idx, done) {
  list = list.slice();
  let i = Math.min(idx, list.length - 1), sc = 1, tx = 0, ty = 0, changed = false;
  const v = document.createElement('div'); v.className = 'viewer';
  document.body.appendChild(v);
  const close = () => { v.remove(); if (changed && done) done(); };
  const apply = () => { const im = $('img', v); if (im) im.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) scale(' + sc + ')'; };
  async function show() {
    const m = list[i]; sc = 1; tx = 0; ty = 0;
    const url = await blobUrl(m.id);
    v.innerHTML = '<div class="vt"><button class="ib" data-v="close" aria-label="Close">' + ic('x', 22) + '</button><div class="cnt">' + (i + 1) + ' / ' + list.length + '</div>' +
      '<button class="ib" data-v="edit" aria-label="Edit">' + ic('edit', 20) + '</button><button class="ib" data-v="share" aria-label="Share">' + ic('share', 20) + '</button><button class="ib" data-v="del" aria-label="Delete">' + ic('trash', 20) + '</button></div>' +
      '<div class="stage">' + (m.kind === 'image' ? '<img alt="" src="' + url + '">' :
        '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;padding:30px;text-align:center">' + ic('file', 56) + '<div style="font-weight:600;overflow-wrap:anywhere">' + esc(m.name) + '</div><button class="btn" style="width:auto;padding:0 28px" data-v="share">Open / Share</button></div>') +
      (list.length > 1 ? '<button class="nav" style="left:0;border-radius:0 12px 12px 0" data-v="prev">' + ic('left', 22) + '</button><button class="nav" style="right:0;border-radius:12px 0 0 12px" data-v="next">' + ic('right', 22) + '</button>' : '') + '</div>' +
      '<div class="vb"><b>' + esc(m.category) + '</b> &middot; ' + fmt(m.takenAt) + (m.caption ? '<div style="margin-top:4px;opacity:.9">' + esc(m.caption) + '</div>' : '') + '</div>';
    apply(); bindStage();
  }
  function bindStage() {
    const st = $('.stage', v); if (!st || !$('img', st)) return;
    const ptrs = new Map(); let d0 = 0, s0 = 1, last = null, sx = 0, moved = 0, lastTap = 0;
    st.onpointerdown = e => { st.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); s0 = sc; } last = { x: e.clientX, y: e.clientY }; sx = e.clientX; moved = 0; };
    st.onpointermove = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; sc = Math.min(6, Math.max(1, s0 * Math.hypot(a.x - b.x, a.y - b.y) / d0)); if (sc === 1) { tx = 0; ty = 0; } apply(); }
      else if (sc > 1 && last) { tx += e.clientX - last.x; ty += e.clientY - last.y; apply(); }
      if (last) { moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y); last = { x: e.clientX, y: e.clientY }; }
    };
    st.onpointerup = st.onpointercancel = e => {
      const wasOne = ptrs.size === 1; ptrs.delete(e.pointerId);
      if (wasOne && sc === 1 && list.length > 1 && Math.abs(e.clientX - sx) > 70) { i = (i + (e.clientX < sx ? 1 : list.length - 1)) % list.length; show(); return; }
      if (wasOne && moved < 8) { const now = Date.now(); if (now - lastTap < 300) { sc = sc > 1 ? 1 : 2.5; tx = 0; ty = 0; apply(); lastTap = 0; } else lastTap = now; }
    };
  }
  v.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const a = b.dataset.v, m = list[i];
    if (a === 'close') close();
    else if (a === 'prev') { i = (i + list.length - 1) % list.length; show(); }
    else if (a === 'next') { i = (i + 1) % list.length; show(); }
    else if (a === 'share') { const d = await dbGet('blobs', m.id); if (d) { const r = await shareOrSave(d.blob, m.name || 'file'); if (r === 'downloaded') toast('Saved to downloads'); } }
    else if (a === 'del') {
      if (await confirmDlg('Delete this item?', 'This cannot be undone.', 'Delete', true)) {
        await Repo.delMedia(m); changed = true; list.splice(i, 1);
        if (!list.length) { close(); return; }
        i = Math.min(i, list.length - 1); show();
      }
    } else if (a === 'edit') {
      sheet('<h3>Edit details</h3><div class="lbl">Category</div><div class="chips wrapchips" id="ecats">' + MEDIA_CATS.map(c => '<button class="chip sm ' + (c === m.category ? 'on' : '') + '" data-c="' + c + '">' + c + '</button>').join('') + '</div>' +
        '<div class="lbl">Caption</div><input class="inp" id="ecap" value="' + esc(m.caption || '') + '" placeholder="Optional"><div style="height:16px"></div><button class="btn" id="esave">Save</button>', (s, cl) => {
        let cat = m.category;
        $('#ecats', s).onclick = ev => { const c = ev.target.closest('[data-c]'); if (!c) return; cat = c.dataset.c; $$('#ecats .chip', s).forEach(x => x.classList.toggle('on', x === c)); };
        $('#esave', s).onclick = async () => { await Repo.updMedia(m.id, cat, $('#ecap', s).value); m.category = cat; m.caption = nn($('#ecap', s).value); changed = true; cl(); show(); };
      });
    }
  });
  show();
}

/* ---------- in-app updates ---------- */
let UPDATE_AVAILABLE = false;
async function checkUpdate(manual) {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    UPDATE_AVAILABLE = j.build !== BUILD_ID;
    showUpdateBar();
    if (manual) toast(UPDATE_AVAILABLE ? 'Update available' : 'You are on the latest version');
    return UPDATE_AVAILABLE;
  } catch (e) { if (manual) toast('Could not check - are you online?'); return false; }
}
function showUpdateBar() {
  let b = $('#updbar');
  if (!UPDATE_AVAILABLE) { if (b) b.remove(); return; }
  if (b) return;
  b = document.createElement('div'); b.id = 'updbar'; b.className = 'updbar';
  b.innerHTML = '<span>New version available</span><button>Update now</button>';
  b.querySelector('button').onclick = applyUpdate;
  document.body.appendChild(b);
}
async function applyUpdate() {
  const bz = busy('Updating...');
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    try { await fetch('index.html', { cache: 'reload' }); await fetch('./', { cache: 'reload' }); } catch (e) { /* offline fallback below */ }
  } catch (e) { /* ignore */ }
  location.reload();
}

        '<div><label class="lbl">Sex <i>*</i></label><div class="seg" id="sex">' + ['Male', 'Female', 'Other'].map(s => '<button type="button" data-s="' + s + '" class="' + (v.sex === s ? 'on' : '') + '">' + s + '</button>').join('') + '</div></div></div>' +
        '<label class="lbl">Chief complaints <i>*</i></label><textarea class="ta" id="cc" placeholder="Presenting complaints, duration">' + esc(v.cc || '') + '</textarea>' +
        '<label class="lbl">Mobile (optional)</label><input class="inp" id="mobile" type="tel" inputmode="tel" placeholder="For quick call" value="' + esc(v.mobile || '') + '">', true) +
      '<div class="bar"><div class="in"><button class="btn" data-act="save">' + (ex ? 'Save Changes' : 'Save &amp; Continue') + '</button></div></div>',
    acts: {
      discard: async () => { await metaSet('draft', null); replace('addPatient', {}); },
      save: async () => {
        const f = { uhid: $('#uhid').value.trim(), name: $('#name').value.trim(), age: $('#age').value.trim(), cc: $('#cc').value.trim() };
        const sex = (($('#sex .on') || {}).dataset || {}).s;
        let bad = false;
        const mark = (sel, cond) => { const el = $(sel); el.classList.toggle('err', !cond); if (!cond) bad = true; };
        mark('#uhid', !!f.uhid); mark('#name', !!f.name); mark('#cc', !!f.cc);
        const ageN = Number(f.age); mark('#age', f.age !== '' && Number.isInteger(ageN) && ageN >= 0 && ageN <= 120);
        $('#sex').classList.toggle('err', !sex); if (!sex) bad = true;
        if (bad) { toast('Please fill the highlighted fields'); const e = $('.err'); e && e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        const dup = await Repo.uhidTaken(f.uhid, id);
        if (dup) { toast('UHID already exists'); return; }
        try {
          const pid = await Repo.savePatient(Object.assign({}, ex || { dx: [], addDx: null }, { id: id, uhid: f.uhid, name: f.name, age: ageN, sex, cc: f.cc, mobile: nn($('#mobile').value) }));
          if (!ex) { await metaSet('draft', null); replace('dx', { pid, isNew: true }); }
          else { toast('Saved'); back(); }
        } catch (e) { toast(/Constraint/i.test(String(e && e.name)) ? 'UHID already exists' : 'Could not save: ' + (e && e.message)); }
      }
    },
    bind: root => {
      $('#sex').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; $$('#sex button').forEach(x => x.classList.toggle('on', x === b)); $('#sex').classList.remove('err'); saveDraft(); };
      const chk = debounce(async () => {
        if (!$('#uhid')) return; const v2 = $('#uhid').value; const d = v2.trim() ? await Repo.uhidTaken(v2, id) : null;
        $('#uhid').classList.toggle('err', !!d);
        $('#dup').innerHTML = d ? '<div class="dup">' + ic('alert', 18) + '<span>UHID already registered to <b>' + esc(d.name) + '</b></span><button data-act="openDup" data-id="' + d.id + '">Open</button></div>' : '';
      }, 250);
      const saveDraft = debounce(async () => {
        if (id || !$('#uhid')) return;
        await metaSet('draft', { uhid: $('#uhid').value, name: $('#name').value, age: $('#age').value, cc: $('#cc').value, mobile: $('#mobile').value, sex: (($('#sex .on') || {}).dataset || {}).s || null });
      }, 400);
      root.addEventListener('input', e => { e.target.classList.remove('err'); if (e.target.id === 'uhid') chk(); saveDraft(); });
      if (v.uhid) chk();
      if (!ex && !v.uhid) setTimeout(() => { const u = $('#uhid'); u && u.focus(); }, 250);
    }
  };
};

/* ---------------- diagnosis selection ---------------- */
Views.dx = async ({ pid, isNew }) => {
  const p = await Repo.patient(pid);
  const sel = new Map((p.dx || []).map(d => [d.name, d.lat || null]));
  let other = p.addDx || '';
  const grid = () => '<div class="two" style="grid-template-columns:1fr 1fr;gap:10px">' + DX_OPTIONS.map(o =>
    '<div class="card dxcard ' + (sel.has(o.name) ? 'sel' : '') + '" data-act="toggle" data-n="' + esc(o.name) + '" style="margin:0;padding:12px"><div class="iconbox">' + dxIc(o.name, 26) + '</div><div class="nm" style="font-size:14px">' + esc(o.name) + '</div>' +
    (sel.has(o.name) ? '<span class="chk r on" style="width:22px;height:22px">' + ic('check', 14) + '</span>' : '') + '</div>').join('') + '</div>';
  const subs = () => {
    let h = '';
    DX_OPTIONS.forEach(o => {
      if (!sel.has(o.name)) return;
      if (o.paired) h += '<div class="card" style="margin-top:10px"><b>' + esc(o.name) + '</b> <span class="small">- laterality</span><div class="seg" style="margin-top:8px" data-lat="' + esc(o.name) + '">' + LATERALITY.map(l => '<button type="button" data-l="' + l + '" class="' + (sel.get(o.name) === l ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
      if (o.name === 'Other') h += '<div class="card" style="margin-top:10px"><b>Other diagnosis</b><input class="inp" id="oth" style="margin-top:8px" placeholder="Specify diagnosis" value="' + esc(other) + '"></div>';
    });
    return h;
  };
  return {
    html: hdr('Diagnosis') + wrapPage('<div class="phead" style="margin-bottom:6px"><div class="avatar">' + esc(initials(p.name)) + '</div><div><div class="t-name">' + esc(p.name) + '</div><div class="t-sub"><b>' + esc(p.uhid) + '</b></div></div></div>' +
      '<div class="small" style="margin:10px 2px 12px">Tap to select. You can choose more than one.</div><div id="dxg">' + grid() + '</div><div id="dxs">' + subs() + '</div>', true) +
      '<div class="bar"><div class="in"><div class="row">' + (isNew ? '<button class="btn o" style="height:52px" data-act="skip">Skip</button>' : '') + '<button class="btn" data-act="save">Save</button></div></div></div>',
    acts: {
      toggle: el => { const n = el.dataset.n; if (sel.has(n)) sel.delete(n); else sel.set(n, null); $('#dxg').innerHTML = grid(); $('#dxs').innerHTML = subs(); },
      skip: () => replace('profile', { id: pid }),
      save: async () => {
        const o = $('#oth'); if (o) other = o.value.trim();
        const dx = [...sel.entries()].map(([name, lat]) => lat ? { name, lat } : { name });
        await Repo.setDx(pid, dx, sel.has('Other') ? other : null);
        if (isNew) replace('profile', { id: pid }); else { toast('Diagnosis saved'); back(); }
      }
    },
    bind: root => {
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-l]'); if (!b) return;
        const n = b.parentElement.dataset.lat; sel.set(n, sel.get(n) === b.dataset.l ? null : b.dataset.l);
        $$('button', b.parentElement).forEach(x => x.classList.toggle('on', x === b && sel.get(n) === b.dataset.l));
      });
    }
  };
};

    { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((s, i) => '<sheet name="' + xe(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>' },
    { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0F2942"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFCBD5E1"/></left><right style="thin"><color rgb="FFCBD5E1"/></right><top style="thin"><color rgb="FFCBD5E1"/></top><bottom style="thin"><color rgb="FFCBD5E1"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' }
  ];
  sheets.forEach((s, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s.rows, s.widths) }));
  return zipStore(files);
}

/* ---- case series data ---- */
const dfx = s => { if (!s) return ''; const d = parseIso(s); return String(d.getDate()).padStart(2, '0') + '-' + MONTHS[d.getMonth()] + '-' + d.getFullYear(); };
async function caseSeriesBook(patients, anon) {
  const [invAll, surAll, fuAll, noteAll, medAll] = await Promise.all(['investigations', 'surgeries', 'followups', 'notes', 'media'].map(dbAll));
  const by = (arr, id) => arr.filter(x => x.patientId === id);
  const ps = patients.slice().sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || '') || a.id - b.id);
  const idCols = anon ? ['Case #'] : ['Case #', 'UHID', 'Patient name'];
  const idv = (p, i) => anon ? ['C' + String(i + 1).padStart(2, '0')] : ['C' + String(i + 1).padStart(2, '0'), p.uhid, p.name];
  const idw = anon ? [9] : [9, 16, 22];
  const stdInv = INV_OPTIONS.filter(n => n !== 'Other');
  const main = [idCols.concat(['Age', 'Sex'], anon ? [] : ['Mobile'], ['Registered on', 'Chief complaints', 'Diagnosis', 'Laterality', 'Clinical notes'], stdInv, ['Other investigations', 'No. of surgeries', 'Name of surgery', 'Date of surgery', 'Duration (min)', 'Assistant 1', 'Assistant 2', 'Assistant 3', 'Indication', 'Operative findings', 'Operative notes', 'HPE', 'Post-op notes', 'No. of visits', 'Last visit date', 'Last status', 'Last visit notes', 'Next follow-up due', 'Follow-up course', 'Media items'])];
  const fuS = [idCols.concat(['Date', 'Type', 'Status', 'Notes', 'Next planned'])];
  const suS = [idCols.concat(['Date of surgery', 'Name of surgery', 'Duration (min)', 'Assistant 1', 'Assistant 2', 'Assistant 3', 'Indication', 'Operative findings', 'Operative notes', 'HPE', 'Post-op notes'])];
  const ivS = [idCols.concat(['Investigation', 'Date', 'Result / notes'])];
  ps.forEach((p, i) => {
    const id = idv(p, i);
    const invs = by(invAll, p.id).sort((a, b) => a.date.localeCompare(b.date));
    const sus = by(surAll, p.id).sort((a, b) => a.date.localeCompare(b.date));
    const fus = by(fuAll, p.id).sort((a, b) => a.date.localeCompare(b.date));
    const visits = fus.filter(f => f.completed), pend = fus.find(f => !f.completed), last = visits[visits.length - 1];
    const notes = by(noteAll, p.id).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    const j = (arr, f) => arr.map(f).join('\n');
    const multi = sus.length > 1, one = (k) => multi ? j(sus, (s, n) => (n + 1) + ') ' + (s[k] || '-')) : (sus[0] ? sus[0][k] || '' : '');
    main.push(id.concat([p.age, p.sex], anon ? [] : [p.mobile || ''], [dfx((p.createdAt || '').slice(0, 10)), p.cc || '', (p.dx || []).map(d => d.name === 'Other' && p.addDx ? p.addDx : d.name).join(', '), (p.dx || []).filter(d => d.lat).map(d => d.name + ': ' + d.lat).join(', '), j(notes, n => dfx(n.createdAt.slice(0, 10)) + ': ' + n.note)],
      stdInv.map(n => j(invs.filter(x => x.name === n), x => dfx(x.date) + (x.notes ? ': ' + x.notes : ' (done)'))),
      [j(invs.filter(x => !stdInv.includes(x.name)), x => x.name + ' ' + dfx(x.date) + (x.notes ? ': ' + x.notes : '')), sus.length,
        multi ? j(sus, (s, n) => (n + 1) + ') ' + s.procedure) : (sus[0] ? sus[0].procedure : ''), multi ? j(sus, (s, n) => (n + 1) + ') ' + dfx(s.date)) : (sus[0] ? dfx(sus[0].date) : ''),
        multi ? j(sus, (s, n) => (n + 1) + ') ' + (s.duration || '-')) : (sus[0] && sus[0].duration ? sus[0].duration : ''), one('assist1'), one('assist2'), one('assist3'), one('indication'), one('findings'), one('notes'), one('hpe'), one('postop'),
        visits.length, last ? dfx(last.date) : '', last ? last.status || 'Not recorded' : '', last ? last.notes || '' : '', pend ? dfx(pend.date) : '',
        j(visits, f => dfx(f.date) + ' - ' + (f.status || 'status n/r') + (f.notes ? ' - ' + f.notes : '')), by(medAll, p.id).length]));
    visits.concat(pend ? [pend] : []).forEach(f => fuS.push(id.concat([dfx(f.date), f.completed ? 'Visit' : 'Scheduled', f.status || '', f.notes || '', f.nextDate ? dfx(f.nextDate) : ''])));
    sus.forEach(s => suS.push(id.concat([dfx(s.date), s.procedure, s.duration || '', s.assist1 || '', s.assist2 || '', s.assist3 || '', s.indication || '', s.findings || '', s.notes || '', s.hpe || '', s.postop || ''])));
    invs.forEach(x => ivS.push(id.concat([x.name, dfx(x.date), x.notes || ''])));
  });
  const lead = main[0].length;
  const mw = idw.concat([7, 9], anon ? [] : [14], [13, 34, 26, 16, 34], stdInv.map(() => 26), [30, 11, 24, 16, 13, 16, 16, 16, 28, 30, 34, 28, 28, 10, 14, 13, 32, 15, 44, 9]);
  return buildXlsx([
    { name: 'Case Series', rows: main, widths: mw }, { name: 'Surgeries', rows: suS, widths: idw.concat([14, 24, 13, 16, 16, 16, 28, 30, 34, 28, 28]) },
    { name: 'Follow-ups', rows: fuS, widths: idw.concat([14, 11, 13, 40, 14]) }, { name: 'Investigations', rows: ivS, widths: idw.concat([20, 14, 44]) }
  ]);
}

/* ---- case series view ---- */
const CS = { dx: new Set(), proc: new Set(), sex: 'Any', amin: '', amax: '', anon: true, demo: false };
Views.caseSeries = async () => {
  const [ps, sur] = await Promise.all([Repo.patients(), dbAll('surgeries')]);
  const realCount = ps.filter(p => !p.isDemo).length;
  if (!realCount && ps.length) CS.demo = true;
  const procs = [...new Set(sur.map(s => s.procedure))].sort();
  const procByPt = new Map(); sur.forEach(s => { (procByPt.get(s.patientId) || procByPt.set(s.patientId, new Set()).get(s.patientId)).add(s.procedure); });
  const match = () => ps.filter(p => {
    if (p.isDemo && !CS.demo) return false;
    if (CS.dx.size && !(p.dx || []).some(d => CS.dx.has(d.name))) return false;
    if (CS.proc.size && ![...(procByPt.get(p.id) || [])].some(x => CS.proc.has(x))) return false;
    if (CS.sex !== 'Any' && p.sex !== CS.sex) return false;
    if (CS.amin !== '' && p.age < Number(CS.amin)) return false;
    if (CS.amax !== '' && p.age > Number(CS.amax)) return false;
    return true;
  });
  const chipRow = (items, set, attr) => '<div class="chips wrapchips">' + items.map(c => '<button type="button" class="chip sm ' + (set.has(c) ? 'on' : '') + '" ' + attr + '="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>';
  const sw = (id, on) => '<button class="sw ' + (on ? 'on' : '') + '" data-tg="' + id + '"></button>';
  return {
    html: hdr('Case Series') + wrapPage(
      '<div class="small" style="margin:2px 2px 4px">Pick filters, then export all matching cases to Excel - one row per case with every detail.</div>' +
      '<label class="lbl">Diagnosis</label>' + chipRow(DX_OPTIONS.map(o => o.name), CS.dx, 'data-dx') +
      (procs.length ? '<label class="lbl">Surgery done</label>' + chipRow(procs, CS.proc, 'data-pr') : '') +
      '<div class="two" style="grid-template-columns:1fr 1fr 1fr;gap:10px"><div><label class="lbl">Age from</label><input class="inp" id="amin" type="number" inputmode="numeric" value="' + esc(CS.amin) + '"></div><div><label class="lbl">Age to</label><input class="inp" id="amax" type="number" inputmode="numeric" value="' + esc(CS.amax) + '"></div><div><label class="lbl">Sex</label><select class="sel" id="sx">' + ['Any', 'Male', 'Female', 'Other'].map(s => '<option ' + (CS.sex === s ? 'selected' : '') + '>' + s + '</option>').join('') + '</select></div></div>' +
      '<div class="card mrow" style="margin-top:16px"><div class="grow"><div class="t">Anonymize</div><div class="s">Hides name, UHID, mobile. Cases become C01, C02...</div></div>' + sw('anon', CS.anon) + '</div>' +
      (ps.some(p => p.isDemo) ? '<div class="card mrow"><div class="grow"><div class="t">Include sample patients</div></div>' + sw('demo', CS.demo) + '</div>' : '') +
      '<div class="small" style="margin:6px 2px">Anonymize hides identifier fields only. Names typed inside notes are not removed - check before sharing.</div>', true) +
      '<div class="bar"><div class="in"><button class="btn" id="xbtn"></button></div></div>',
    acts: {},
    bind: root => {
      const upd = () => { const n = match().length; const b = $('#xbtn'); b.disabled = !n; b.innerHTML = ic('download', 20) + ' Export Excel (' + n + ' case' + (n === 1 ? '' : 's') + ')'; };
      const flip = (set, v, el) => { set.has(v) ? set.delete(v) : set.add(v); el.classList.toggle('on'); upd(); };
      root.addEventListener('click', e => {
        const d = e.target.closest('[data-dx]'); if (d) return flip(CS.dx, d.dataset.dx, d);
        const p = e.target.closest('[data-pr]'); if (p) return flip(CS.proc, p.dataset.pr, p);
        const t = e.target.closest('[data-tg]'); if (t) { CS[t.dataset.tg] = !CS[t.dataset.tg]; t.classList.toggle('on', CS[t.dataset.tg]); upd(); }
      });
      $('#amin').oninput = e => { CS.amin = e.target.value; upd(); }; $('#amax').oninput = e => { CS.amax = e.target.value; upd(); };
      $('#sx').onchange = e => { CS.sex = e.target.value; upd(); };
      $('#xbtn').onclick = async () => {
        const list = match(); if (!list.length) return;
        const blob = await withBusy('Building Excel...', () => caseSeriesBook(list, CS.anon));
        const r = await shareOrSave(blob, 'urovault-case-series-' + iso(today()) + '.xlsx');
        await Repo.audit('export', 'case-series'); if (r === 'downloaded') toast('Saved to downloads');
      };
      upd();
    }
  };
};
ACT.caseSeries = () => go('caseSeries');

</script>
